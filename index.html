      if (r.cosecha >= 4) ops.push({ v: '__COSECHA__', t: 'Rendimiento a cosecha · ' + r.cosecha + ' parcelas' });
      if (!ops.length) { $('rVar').innerHTML = '<p class="vacio">Todavía no hay datos capturados.</p>'; return; }
      $('rVar').innerHTML = '<div class="fila"><div><label>Variable</label><select id="rSel">' + opciones(ops) + '</select></div>' +
        '<div id="rFechaCaja"></div></div><div class="acciones"><button id="rCorrer">Analizar</button></div>';
      function fechas(){

        $('rFechaCaja').innerHTML = info && info.fechas.length > 1 ? '<label>Fecha de evaluación</label><select id="rFecha">' + opciones(info.fechas) + '</select>' : '';
      }

          .catch(function(e){ b.disabled = false; fallo(e); });

function croquisHTML(parcelas){
  if (!parcelas || !parcelas.length) return '<p class="vacio">Sin parcelas.</p>';
  var trats = [], bloques = {};
  parcelas.forEach(function(p){ if (trats.indexOf(p.trat) < 0) trats.push(p.trat); (bloques[p.bloque] = bloques[p.bloque] || []).push(p); });
  trats.sort();
  function color(t){ return PALETA[Math.max(0, trats.indexOf(t)) % PALETA.length]; }
  return Object.keys(bloques).sort(function(a, b){ return Number(a) - Number(b); }).map(function(b){
    return '<div class="bloque"><h2>Bloque ' + h(b) + '</h2><div class="celdas">' + bloques[b].sort(function(x, y){ return x.col - y.col; }).map(function(p){
      return '<div class="celda" style="background:' + color(p.trat) + '"><b>' + h(p.num) + '</b><span>' + h(p.trat) + '</span></div>';
    }).join('') + '</div></div>';
  }).join('') + '<div class="leyenda">' + trats.map(function(t){ return '<span><i style="background:' + color(t) + '"></i>' + h(t) + '</span>'; }).join('') + '</div>';
}

function tablaAnalisis(a){
  var p = a.p < 0.0001 ? '< 0.0001' : (Math.round(a.p * 10000) / 10000);
  var filas = [['Tratamientos', a.glTrat, a.scTrat, a.cmTrat, a.f, p]];
  if (a.usaBloques) filas.push(['Bloques', a.glBloque, a.scBloque, '', a.fBloque,
    a.pBloque < 0.0001 ? '< 0.0001' : Math.round(a.pBloque * 10000) / 10000]);
  filas.push(['Error', a.glError, a.scError, a.cmError, '', '']);
  filas.push(['Total', a.glTrat + (a.glBloque || 0) + a.glError, a.scTotal, '', '', '']);
  return '<h3>' + h(a.variable) + ' · ' + h(a.fecha) + '</h3>' +
    '<p class="lectura">' + h(a.lectura) + '</p>' +
    '<div class="cifras">' + cifra(a.media, 'media general') + cifra(a.cv + '%', 'coef. de variación') +
      cifra(a.dms, 'DMS al 5 %') + cifra(p, 'valor p', a.p < 0.05 ? '' : 'alerta') + '</div>' +
    '<div class="tabla-env" style="margin-bottom:14px"><table class="tabla"><tr><th>Fuente</th><th class="num">GL</th><th class="num">SC</th><th class="num">CM</th><th class="num">F</th><th class="num">p</th></tr>' +
      filas.map(function(f){ return '<tr>' + f.map(function(x, i){ return '<td' + (i ? ' class="num"' : '') + '>' + (x === '' || x === null ? '' : h(x)) + '</td>'; }).join('') + '</tr>'; }).join('') +
    '</table></div>' +
    '<div class="tabla-env"><table class="tabla"><tr><th>Tratamiento</th><th class="num">Media</th><th>Grupo</th></tr>' +
      a.medias.map(function(m){ return '<tr><td>' + h(m.trat) + '</td><td class="num">' + h(m.media) + '</td><td><b class="letra">' + h(m.letra) + '</b></td></tr>'; }).join('') +
    '</table></div><p class="guia" style="margin-top:8px">Medias con la misma letra no difieren entre sí según la DMS al 5 %.</p>';
}
</script>
<script>
/* ===================================================================
 * CAMPO: MUESTREO Y COSECHA
 *
 * Todo dato se guarda primero en el teléfono y se envía cuando hay
 * señal. Cada registro lleva un identificador único, así que reenviar
 * nunca duplica. El paquete de cada ensayo (parcelas, lotes de la finca
 * y plan) también queda guardado para abrirlo sin señal.
 * =================================================================== */

/* ------------------------- cola de envío ------------------------- */
var Cola = {
  todos: function(){ return Local.get('ens_cola', []); },
  pendientes: function(){ return Cola.todos(); },
  rechazados: function(){ return Local.get('ens_cola_rechazados', []); },
  guardar: function(lista){
    if (!Local.set('ens_cola', lista)) msg('El teléfono se quedó sin espacio para guardar datos. Envíe los pendientes.', 'err');
    Cola.pintar();
  },
  agregar: function(items){
    Cola.guardar(Cola.todos().concat(items));
    setTimeout(function(){ Cola.enviar(true); }, 300);
  },
  enviando: false,
  enviar: function(silencioso){
    var lista = Cola.todos();
    if (Cola.enviando || !lista.length || !SESION || !tokenGuardado()) return Promise.resolve(0);
    Cola.enviando = true; Cola.pintar();
    var lote = lista.slice(0, 400);
    return api('sincronizar', lote).then(function(r){
      var listos = {}, malos = {};
      (r.aceptados || []).forEach(function(u){ listos[u] = true; });
      (r.errores || []).forEach(function(e){ malos[e.uuid] = e.error; });
      var quedan = Cola.todos().filter(function(x){ return !listos[x.uuid] && !malos[x.uuid]; });
      var rech = lote.filter(function(x){ return malos[x.uuid]; }).map(function(x){ x.error = malos[x.uuid]; return x; });
      if (rech.length) Local.set('ens_cola_rechazados', Cola.rechazados().concat(rech).slice(-500));
      Cola.enviando = false;
      Cola.guardar(quedan);
      if (!silencioso || rech.length) msg((r.guardados ? r.guardados + ' datos enviados.' : 'Todo estaba enviado.') +
        (rech.length ? ' ' + rech.length + ' no se aceptaron: ' + h(rech[0].error) : ''), rech.length ? 'err' : 'ok');
      if (quedan.length) return Cola.enviar(true);
      return r.guardados;
    }).catch(function(e){
      Cola.enviando = false; Cola.pintar();
      if (!silencioso && !e.manejado) msg(e.sinRed ? 'Sin señal: los datos quedan guardados en el teléfono.' : h(e.message), e.sinRed ? 'info' : 'err');
      return 0;
    });
  },
  /** Pastilla de estado en la barra: cuántos datos esperan señal. */
  pintar: function(){
    $$('.estado-red').forEach(function(el){
      var n = Cola.todos().length;
      el.className = 'estado-red' + (n ? ' pend' : '') + (navigator.onLine === false ? ' sin' : '');
      el.textContent = Cola.enviando ? 'Enviando…' : n ? n + ' sin enviar' : (navigator.onLine === false ? 'Sin señal' : 'Al día');
    });
  }
};
window.addEventListener('online', function(){ Cola.pintar(); Cola.enviar(true); });
window.addEventListener('offline', function(){ Cola.pintar(); });
setInterval(function(){ if (navigator.onLine !== false) Cola.enviar(true); }, 60000);

/* ---------------------- paquetes por ensayo ---------------------- */
var Paquetes = {
  clave: function(id){ return 'ens_paq_' + id; },
  copia: function(id){ return Local.get(Paquetes.clave(id), null); },
  olvidar: function(id){ Local.del(Paquetes.clave(id)); },
  guardar: function(id, paq){
    var dato = { guardado: Date.now(), paq: paq };
    if (Local.set(Paquetes.clave(id), dato)) return;
    // Sin espacio: se borran los paquetes más viejos y se reintenta.
    var claves = [];
    try { for (var i = 0; i < localStorage.length; i++) { var k = localStorage.key(i); if (/^ens_paq_/.test(k) && k !== Paquetes.clave(id)) claves.push(k); } } catch (e) {}
    claves.sort(function(a, b){ return ((Local.get(a, {}) || {}).guardado || 0) - ((Local.get(b, {}) || {}).guardado || 0); });
    while (claves.length && !Local.set(Paquetes.clave(id), dato)) Local.del(claves.shift());
  },
  /** Trae el paquete fresco; si no hay señal, entrega la copia guardada. */
  obtener: function(id){
    return api('campoPaquete', id).then(function(p){ Paquetes.guardar(id, p); return p; }).catch(function(e){
      var c = Paquetes.copia(id);
      if (c && (e.sinRed || /no respondió/.test(e.message))) { c.paq.deCopia = c.guardado; return c.paq; }
      throw e;
    });
  }
};
function paqueteDe(id){ return Paquetes.obtener(id); }

function haceCuanto(ms){
  var m = Math.round((Date.now() - ms) / 60000);
  if (m < 2) return 'hace un momento';
  if (m < 60) return 'hace ' + m + ' min';
  if (m < 1440) return 'hace ' + Math.round(m / 60) + ' h';
  return 'hace ' + Math.round(m / 1440) + ' días';
}

/* ----------------------------- mapa ----------------------------- */
var LEAFLET = null;
function cargarLeaflet(){
  if (window.L) return Promise.resolve(window.L);
  if (LEAFLET) return LEAFLET;
  LEAFLET = new Promise(function(resolver, rechazar){
    var css = document.createElement('link');
    css.rel = 'stylesheet'; css.href = 'https://unpkg.com/leaflet@1.9.4/dist/leaflet.css';
    document.head.appendChild(css);
    var js = document.createElement('script');
    js.src = 'https://unpkg.com/leaflet@1.9.4/dist/leaflet.js';
    js.onload = function(){ resolver(window.L); };
    js.onerror = function(){ LEAFLET = null; rechazar(new Error('No se pudo cargar el mapa (sin señal). Use la pestaña Lista.')); };
    document.head.appendChild(js);
  });
  return LEAFLET;
}

/**
 * Radios de curvatura del elipsoide WGS84 en una latitud: con ellos un
 * plano tangente local mide igual que el servidor (el área de un lote
 * coincide con la de la capa al décimo de hectárea).
 */
function radiosWGS84(latGrados){
  var a = 6378137, e2 = 0.00669437999014, s = Math.sin(latGrados * Math.PI / 180), w = 1 - e2 * s * s;
  return { M: a * (1 - e2) / Math.pow(w, 1.5), N: a / Math.sqrt(w) };
}
/** Distancia en metros entre dos [lat, lon] (tramos cortos, como en campo). */
function distanciaM(a, b){
  var r = radiosWGS84((a[0] + b[0]) / 2), k = Math.PI / 180;
  var dy = (b[0] - a[0]) * k * r.M, dx = (b[1] - a[1]) * k * r.N * Math.cos((a[0] + b[0]) / 2 * k);
  return Math.sqrt(dx * dx + dy * dy);
}
/** Área en m² de un polígono [[lat, lon], …] en el plano tangente local. */
function areaM2(pts){
  if (pts.length < 3) return 0;
  var lat0 = pts.reduce(function(s, p){ return s + p[0]; }, 0) / pts.length, k = Math.PI / 180;
  var r = radiosWGS84(lat0), c = Math.cos(lat0 * k), s = 0;
  var xy = pts.map(function(p){ return [(p[1] - pts[0][1]) * k * r.N * c, (p[0] - pts[0][0]) * k * r.M]; });
  for (var i = 0; i < xy.length; i++) { var u = xy[i], v = xy[(i + 1) % xy.length]; s += u[0] * v[1] - v[0] * u[1]; }
  return Math.abs(s / 2);
}
function formatoM(m){ return m >= 1000 ? numero(m / 1000, 3) + ' km' : numero(m, 1) + ' m'; }

/**
 * Mapa del ensayo: lotes de la finca, lotes del ensayo resaltados,
 * parcelas con su número, posición GPS y regla para medir distancias y
 * áreas. Sin señal, el fondo satelital puede no cargar, pero los
 * polígonos (que vienen en el paquete) se dibujan igual.
 */
var MapaCampo = {
  montar: function(contenedor, paq, op){
    op = op || {};
    var M = { capas: {}, color: null, gps: null, aro: null, watch: null, midiendo: null, puntos: [], trazo: null, marcas: [] };
    var trats = [];
    paq.parcelas.forEach(function(p){ if (trats.indexOf(p.trat) < 0) trats.push(p.trat); });
    trats.sort();
    M.colorTrat = function(t){ return PALETA[Math.max(0, trats.indexOf(t)) % PALETA.length]; };
    if (op.leyenda) op.leyenda.innerHTML = trats.map(function(t){ return '<span><i style="background:' + M.colorTrat(t) + '"></i>' + h(t || 'sin tratamiento') + '</span>'; }).join('') +
      '<span><i style="background:transparent;border:2px solid #FFE45C"></i>lote del ensayo</span>';

    var listo = Promise.resolve().then(cargarLeaflet).then(function(L){
      contenedor.innerHTML = '';
      var mapa = L.map(contenedor, { zoomControl: false, attributionControl: true, maxZoom: 21 });
      M.mapa = mapa;
      var google = L.tileLayer('https://{s}.google.com/vt/lyrs=s,h&x={x}&y={y}&z={z}',
        { maxZoom: 21, maxNativeZoom: 20, subdomains: ['mt0', 'mt1', 'mt2', 'mt3'], attribution: 'Google' });
      var esri = L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}',
        { maxZoom: 21, maxNativeZoom: 19, attribution: 'Esri' });
      google.addTo(mapa);
      L.control.layers({ 'Satélite (Google)': google, 'Satélite (Esri)': esri, 'Sin fondo': L.layerGroup() }, null,
                       { position: 'bottomleft' }).addTo(mapa);
      L.control.scale({ imperial: false, position: 'bottomright' }).addTo(mapa);

      var limites = null;
      function ampliar(b){ limites = limites ? limites.extend(b) : L.latLngBounds(b.getSouthWest(), b.getNorthEast()); }

      if (paq.lotes && paq.lotes.length) {
        L.geoJSON({ type: 'FeatureCollection', features: paq.lotes }, {
          style: function(f){ return f.properties.delEnsayo
            ? { color: '#FFE45C', weight: 3, fill: false, interactive: false }
            : { color: '#ffffff', weight: 1, opacity: .75, fill: false, interactive: false }; },
          onEachFeature: function(f, capa){
            capa.bindTooltip(String(f.properties.lote), { permanent: true, direction: 'center', className: 'etq-lote', interactive: false });
            if (f.properties.delEnsayo) ampliar(capa.getBounds());
          }
        }).addTo(mapa);
      }

      paq.parcelas.forEach(function(p){
        if (!p.geom) return;
        var capa = L.geoJSON(p.geom, { style: M.estilo(p) }).addTo(mapa);
        capa.bindTooltip(String(p.num), { permanent: true, direction: 'center', className: 'etq' });
        capa.on('click', function(){ if (!M.midiendo && op.alTocar) op.alTocar(p); });
        M.capas[p.id] = capa;
        ampliar(capa.getBounds());
      });
      if (limites) mapa.fitBounds(limites, { padding: [30, 30] });
      else if (paq.parcelas[0] && paq.parcelas[0].lat) mapa.setView([paq.parcelas[0].lat, paq.parcelas[0].lon], 17);
      else mapa.setView([14.2, -91.2], 12);

      if (op.herramientas !== false) M.herramientas(contenedor);
      M.iniciarGPS();
      mapa.on('click', function(e){ if (M.midiendo) M.agregarPunto([e.latlng.lat, e.latlng.lng]); });
      setTimeout(function(){ mapa.invalidateSize(); }, 120);
      return M;
    }).catch(function(e){
      contenedor.innerHTML = '<div class="vacio">' + h(e.message) + '</div>';
      return null;
    });

    /* estilos */
    function estiloBase(p){ return { color: '#ffffff', weight: 1.6, fillColor: M.colorTrat(p.trat), fillOpacity: .5 }; }
    M.estilo = function(p){
      var e = estiloBase(p);
      if (M.color) { var x = M.color(p); if (x) { e.fillColor = x.fill || e.fillColor; e.fillOpacity = x.opacidad || .75; e.color = x.borde || '#B6E59A'; e.weight = x.grosor || 3; } }
      return function(){ return e; };
    };
    M.recolorear = function(fn){
      M.color = fn;
      paq.parcelas.forEach(function(p){ if (M.capas[p.id]) M.capas[p.id].setStyle(M.estilo(p)()); });
    };
    M.irA = function(p){ if (M.capas[p.id]) M.mapa.fitBounds(M.capas[p.id].getBounds(), { padding: [70, 70], maxZoom: 20 }); };

    /* GPS */
    M.iniciarGPS = function(){
      if (!navigator.geolocation) return;
      M.watch = navigator.geolocation.watchPosition(function(pos){
        var ll = [pos.coords.latitude, pos.coords.longitude];
        M.ultima = { lat: Number(ll[0].toFixed(7)), lon: Number(ll[1].toFixed(7)), prec: Math.round(pos.coords.accuracy) };
        if (!M.mapa) return;
        if (!M.gps) {
          M.aro = L.circle(ll, { radius: pos.coords.accuracy, color: '#4C9BE8', fillColor: '#4C9BE8', fillOpacity: .15, weight: 1, interactive: false }).addTo(M.mapa);
          M.gps = L.circleMarker(ll, { radius: 8, color: '#fff', weight: 2.5, fillColor: '#2F7FD6', fillOpacity: 1, interactive: false }).addTo(M.mapa);
        } else { M.gps.setLatLng(ll); M.aro.setLatLng(ll).setRadius(pos.coords.accuracy); }
      }, function(){ M.sinGPS = true; }, { enableHighAccuracy: true, maximumAge: 5000, timeout: 20000 });
    };
    M.destruir = function(){
      if (M.watch !== null && navigator.geolocation) navigator.geolocation.clearWatch(M.watch);
      if (M.mapa) M.mapa.remove();
      M.mapa = null;
    };

    /* herramientas: mi ubicación, regla y área */
    M.herramientas = function(cont){
      var caja = document.createElement('div');
      caja.className = 'herr';
      caja.innerHTML = '<button data-h="gps" title="Mi ubicación">' + IC.gps + '</button>' +
        '<button data-h="distancia" title="Medir distancia">' + IC.regla + '</button>' +
        '<button data-h="area" title="Medir área">' + IC.area + '</button>';
      cont.appendChild(caja);
      var panel = document.createElement('div');
      panel.className = 'medida oculto';
      cont.appendChild(panel);
      M.panel = panel;
      L.DomEvent.disableClickPropagation(caja); L.DomEvent.disableClickPropagation(panel);
      al('[data-h]', 'click', function(b){
        var que = b.dataset.h;
        if (que === 'gps') {
          if (!M.gps) return msg(M.sinGPS ? 'No hay permiso de ubicación. Actívelo en el teléfono.' : 'Buscando señal GPS…', 'info');
          M.mapa.setView(M.gps.getLatLng(), Math.max(M.mapa.getZoom(), 18));
          return msg('Precisión del GPS: ' + M.ultima.prec + ' m', 'ok');
        }
        M.medir(M.midiendo === que ? null : que);
        $$('[data-h]', caja).forEach(function(x){ x.classList.toggle('on', x.dataset.h === M.midiendo); });
      }, caja);
    };
    M.medir = function(modo){
      M.midiendo = modo; M.puntos = [];
      if (M.trazo) { M.mapa.removeLayer(M.trazo); M.trazo = null; }
      M.marcas.forEach(function(m){ M.mapa.removeLayer(m); }); M.marcas = [];
      if (!modo) { M.panel.className = 'medida oculto'; return; }
      M.panel.className = 'medida';
      M.pintarMedida();
    };
    M.agregarPunto = function(ll){
      M.puntos.push(ll);
      M.marcas.push(L.circleMarker(ll, { radius: 5, color: '#fff', weight: 2, fillColor: '#E2A400', fillOpacity: 1, interactive: false }).addTo(M.mapa));
      if (M.trazo) M.mapa.removeLayer(M.trazo);
      M.trazo = (M.midiendo === 'area' && M.puntos.length > 2)
        ? L.polygon(M.puntos, { color: '#E2A400', weight: 3, fillOpacity: .15, interactive: false }).addTo(M.mapa)
        : L.polyline(M.puntos, { color: '#E2A400', weight: 3, dashArray: '6 6', interactive: false }).addTo(M.mapa);
      M.pintarMedida();
    };
    M.pintarMedida = function(){
      var d = 0;
      for (var i = 1; i < M.puntos.length; i++) d += distanciaM(M.puntos[i - 1], M.puntos[i]);
      var txt;
      if (M.midiendo === 'area') {
        var a = areaM2(M.puntos), per = d + (M.puntos.length > 2 ? distanciaM(M.puntos[M.puntos.length - 1], M.puntos[0]) : 0);
        txt = M.puntos.length < 3 ? 'Toque al menos 3 puntos en el mapa' :
          '<b>' + numero(a / 10000, 4) + ' ha</b> · ' + numero(a, 0).toLocaleString('es-GT') + ' m²<br><span class="tenue">perímetro ' + formatoM(per) + '</span>';
      } else {
        txt = M.puntos.length < 2 ? 'Toque dos o más puntos en el mapa' : '<b>' + formatoM(d) + '</b>' +
          (M.puntos.length > 2 ? '<br><span class="tenue">último tramo ' + formatoM(distanciaM(M.puntos[M.puntos.length - 2], M.puntos[M.puntos.length - 1])) + '</span>' : '');
      }
      M.panel.innerHTML = (M.midiendo === 'area' ? 'Área' : 'Distancia') + ': ' + txt +
        '<div class="bt"><button class="sec" data-m="gps">+ punto GPS</button><button class="sec" data-m="deshacer">Deshacer</button>' +
        '<button class="sec" data-m="limpiar">Limpiar</button><button data-m="fin">Terminar</button></div>';
      al('[data-m]', 'click', function(b){
        var q = b.dataset.m;
        if (q === 'gps') { if (M.ultima) M.agregarPunto([M.ultima.lat, M.ultima.lon]); else msg('Todavía no hay señal de GPS.', 'info'); }
        else if (q === 'deshacer') { var p = M.puntos.slice(0, -1); var modo = M.midiendo; M.medir(modo); p.forEach(M.agregarPunto); }
        else if (q === 'limpiar') M.medir(M.midiendo);
        else { M.medir(null); $$('.herr [data-h]').forEach(function(x){ x.classList.remove('on'); }); }
      }, M.panel);
    };
    return listo;
  }
};

/* ------------------------ lista de ensayos ------------------------ */
var CAMPO_FILTRO = '';
function campoLista(){
  var cuerpo = armazon('Muestreo y cosecha', SESION.alcance === 'CAMPO' ? SESION.nombre : 'Ensayos en campo',
                       { derecha: '<span class="estado-red"></span>' });
  Cola.pintar();
  var copia = Local.get('ens_campo_lista', null);
  if (copia) pintar(copia, true);
  api('campoLista').then(function(r){ Local.set('ens_campo_lista', r); pintar(r); })
    .catch(function(e){ if (copia) msg('Sin señal: lista guardada ' + haceCuanto(new Date(copia.generado).getTime()) + '.', 'info'); else { cuerpo.innerHTML = '<div class="vacio">' + h(e.message) + '</div>'; } });
  Cola.enviar(true);

  function pintar(r, esCopia){
    var deptos = [];
    r.ensayos.forEach(function(e){ if (!deptos.some(function(d){ return d.id === e.departamento; })) deptos.push({ id: e.departamento, nombre: e.deptoNombre }); });
    var lista = r.ensayos.filter(function(e){ return !CAMPO_FILTRO || e.departamento === CAMPO_FILTRO; });
    var pend = Cola.todos(), rech = Cola.rechazados();
    cuerpo.innerHTML =
      (pend.length ? '<div class="aviso-barra"><b>' + pend.length + ' datos</b> guardados en este teléfono esperan señal. ' +
        '<br><button class="chico" id="cEnviar">Enviar ahora</button></div>' : '') +
      (rech.length ? '<div class="aviso-barra rojo"><b>' + rech.length + ' datos no se aceptaron</b> (por ejemplo: ' + h(rech[rech.length - 1].error) + '). ' +
        '<br><button class="sec chico" id="cRech">Ver y descartar</button></div>' : '') +
      (deptos.length > 1 ? '<div class="pildoras"><button class="pildora' + (!CAMPO_FILTRO ? ' on' : '') + '" data-f="">Todos</button>' +
        deptos.map(function(d){ return '<button class="pildora' + (CAMPO_FILTRO === d.id ? ' on' : '') + '" data-f="' + h(d.id) + '">' + h(d.nombre) + '</button>'; }).join('') + '</div>' : '') +
      '<div class="acciones" style="margin:0 0 12px"><button class="sec chico" id="cBajar">Descargar todos para trabajar sin señal</button></div>' +
      (lista.length ? lista.map(function(e){
        var c = Paquetes.copia(e.id), p = e.proxima;
        return '<button class="ens" data-campo="' + h(e.id) + '"><span class="arriba"><b>' + h(e.nombre) + '</b>' +
          (c ? '<span class="chip verde">sin señal ✓</span>' : '<span class="chip">sin descargar</span>') + '</span>' +
          '<span class="linea">' + h([e.deptoNombre, e.finca, 'lotes ' + e.lotes].filter(Boolean).join(' · ')) + '</span>' +
          '<span class="linea">' + (e.dda !== null && e.dda >= 0 ? e.dda + ' DDA · ' : '') + e.parcelas + ' parcelas' +
            (e.conGeometria ? '' : ' · sin polígonos') + '</span>' +
          (p ? '<span class="prox' + (p.faltan < 0 ? ' tarde' : '') + '">' + h(etiquetaProceso(p.proceso)) + ': ' + h(p.fecha) + ' (' + cuando(p.faltan) + ')</span>' : '') +
          '</button>';
      }).join('') : '<p class="vacio">No hay ensayos activos asignados a su usuario.</p>');

    al('[data-f]', 'click', function(b){ CAMPO_FILTRO = b.dataset.f; pintar(r); }, cuerpo);
    al('[data-campo]', 'click', function(b){ ir(function(){ campoEnsayo(b.dataset.campo); }); }, cuerpo);
    if ($('cEnviar')) $('cEnviar').onclick = function(){ Cola.enviar(false).then(function(){ pintar(r); }); };
    if ($('cRech')) $('cRech').onclick = verRechazados;
    $('cBajar').onclick = function(){
      var b = this; b.disabled = true;
      var ids = lista.map(function(e){ return e.id; }), hechos = 0, cadena = Promise.resolve();
      ids.forEach(function(id){
        cadena = cadena.then(function(){ msg('Descargando ' + (++hechos) + ' de ' + ids.length + '…', 'info', true); return Paquetes.obtener(id); });
      });
      cadena.then(function(){ msg(ids.length + ' ensayos listos para trabajar sin señal.', 'ok'); pintar(r); })
        .catch(function(e){ b.disabled = false; fallo(e); });
    };
    Cola.pintar();
  }
}

function verRechazados(){
  var r = Cola.rechazados();
  var v = ventana('Datos no aceptados', '<p class="guia">El servidor no aceptó estos datos. Puede descartarlos; quedan anotados aquí para que los revise.</p>' +
    '<div class="tabla-env"><table class="tabla"><tr><th>Ensayo</th><th>Dato</th><th>Motivo</th></tr>' + r.slice(-100).map(function(x){
      return '<tr><td class="mono">' + h(x.idEnsayo) + '</td><td>' + h(x.variable || x.tipo) + ' ' + h(x.valor || x.peso || '') + '</td><td>' + h(x.error) + '</td></tr>';
    }).join('') + '</table></div><div class="acciones"><button class="peligro" id="rDesc">Descartar todos</button></div>');
  $('rDesc').onclick = function(){ Local.del('ens_cola_rechazados'); v.cerrar(); atras(); ir(campoLista); };
}

/* ------------------------ captura en un ensayo ------------------------ */
function campoEnsayo(id){
  var S = { paq: null, plan: null, mapa: null, hechas: {}, parcela: null };
  armazon('Cargando…', '', { sinContenido: true, campo: true, derecha: '<span class="estado-red"></span>' });
  app.insertAdjacentHTML('beforeend', '<div class="campo"><div class="cargando">Cargando el croquis…</div></div>');
  Cola.pintar();

  Paquetes.obtener(id).then(function(paq){
    S.paq = paq;
    var e = paq.ensayo;
    armazon(e.nombre, [e.finca, 'lote ' + e.lote, e.dda !== null ? e.dda + ' DDA' : ''].filter(Boolean).join(' · '),
            { sinContenido: true, campo: true, derecha: '<span class="estado-red"></span>' });
    var planes = paq.plan;
    S.plan = planes.filter(function(p){ return p.tipo !== 'VUELO'; })[0] || planes[0] || null;
    app.insertAdjacentHTML('beforeend',
      '<div class="campo">' +
        (paq.deCopia ? '<div class="aviso-barra" style="margin:0;border-radius:0">Sin señal: usando lo descargado ' + haceCuanto(paq.deCopia) + '.</div>' : '') +
        '<div class="selector"><select id="cPlan">' + (planes.length ? planes.map(function(p, i){
          return '<option value="' + i + '"' + (p === S.plan ? ' selected' : '') + '>' + h(p.actividad) + ' · ' +
            h(p.variables.map(function(v){ return v.nombre; }).join(', ')) + '</option>'; }).join('') : '<option>Sin plan de muestreo</option>') +
        '</select><div class="avance" id="cAvance"></div></div>' +
        '<div class="pestanas"><button class="on" data-p="mapa">Mapa</button><button data-p="lista">Lista</button>' +
          '<button data-p="info">Ensayo</button></div>' +
        '<div class="panel" id="cpMapa"><div class="mapa" id="cMapa"></div></div>' +
        '<div class="panel oculto" id="cpLista"></div>' +
        '<div class="panel oculto" id="cpInfo"></div>' +
        '<div class="hoja" id="cHoja"></div>' +
      '</div>');
    Cola.pintar();
    recalcularHechas();
    $('cPlan').onchange = function(){ S.plan = planes[Number(this.value)]; cerrarHoja(); refrescar(); };
    al('.campo .pestanas button', 'click', function(b){
      $$('.campo .pestanas button').forEach(function(x){ x.className = x === b ? 'on' : ''; });
      ['mapa', 'lista', 'info'].forEach(function(p){ $('cp' + p.charAt(0).toUpperCase() + p.slice(1)).className = 'panel' + (p === b.dataset.p ? '' : ' oculto'); });
      if (b.dataset.p === 'mapa' && S.mapa && S.mapa.mapa) setTimeout(function(){ S.mapa.mapa.invalidateSize(); }, 60);
    });
    pintarInfo();
    refrescar();
    var conGeom = paq.parcelas.some(function(p){ return p.geom; });
    if (!conGeom && !(paq.lotes || []).length) {
      $('cMapa').innerHTML = '<div class="vacio">Este ensayo todavía no tiene polígonos de parcelas. Capture desde la pestaña Lista.</div>';
    } else {
      MapaCampo.montar($('cMapa'), paq, { alTocar: abrirHoja }).then(function(m){
        S.mapa = m;
        alSalir(limpiar);
        if (m) m.recolorear(colorHecha);
        if (m && !conGeom) msg('Las parcelas no tienen polígono todavía; el mapa muestra los lotes. Capture desde Lista.', 'info');
      });
    }
  }).catch(function(e){
    var c = document.querySelector('.campo');
    if (c) c.innerHTML = '<div class="vacio">' + h(e.message) + '</div>';
  });

  function limpiar(){ if (S.mapa) { S.mapa.destruir(); S.mapa = null; } }

  function clave(idParcela){ return idParcela + '|' + (S.plan ? S.plan.actividad : ''); }
  function recalcularHechas(){
    S.hechas = {};
    (S.paq.capturadasHoy || []).forEach(function(k){ S.hechas[k] = true; });
    var hoy = fechaHoyISO();
    Cola.todos().forEach(function(x){
      if (x.idEnsayo === id && String(x.fechaLocal || '').substring(0, 10) === hoy && x.tipo !== 'NOTA') S.hechas[x.idParcela + '|' + x.actividad] = true;
    });
  }
  function colorHecha(p){ return S.hechas[clave(p.id)] ? { fill: '#0D9440', opacidad: .78, borde: '#B6E59A', grosor: 3 } : null; }
  function refrescar(){
    var n = S.paq.parcelas.filter(function(p){ return S.hechas[clave(p.id)]; }).length, t = S.paq.parcelas.length;
    $('cAvance').innerHTML = '<b>' + n + '</b>/' + t + '<div class="barra"><i style="width:' + (t ? n / t * 100 : 0) + '%"></i></div>';
    if (S.mapa) S.mapa.recolorear(colorHecha);
    pintarLista();
  }
  function pintarLista(){
    var col = S.mapa ? S.mapa.colorTrat : function(){ return '#ccc'; };
    $('cpLista').innerHTML = '<div class="filas">' + S.paq.parcelas.map(function(p){
      var ok = S.hechas[clave(p.id)];
      return '<button class="fila-p' + (ok ? ' ok' : '') + '" data-par="' + h(p.id) + '"><i style="background:' + col(p.trat) + '"></i>' +
        '<b>' + h(p.num) + '</b><span>' + h(p.trat) + (p.bloque ? ' · bloque ' + h(p.bloque) : '') + '</span><em>' + (ok ? '✓' : '') + '</em></button>';
    }).join('') + '</div>';
    al('[data-par]', 'click', function(b){ abrirHoja(S.paq.parcelas.filter(function(x){ return x.id === b.dataset.par; })[0]); }, $('cpLista'));
  }
  function pintarInfo(){
    var e = S.paq.ensayo;
    $('cpInfo').innerHTML = '<div class="envoltura"><div class="ficha">' + dato('Departamento', e.departamento) + dato('Tipo', e.tipo) +
      dato('Finca', e.finca) + dato('Lotes', e.lote) + dato('Variedad', e.variedad) + dato('Aplicación', e.aplicacion) +
      dato('Diseño', e.diseno) + dato('Surcos de borde', e.surcosBorde) + '</div>' +
      '<h2>Próximas tareas</h2>' + (S.paq.tareas.length ? S.paq.tareas.map(function(t){
        return '<div class="nota"><div class="cab"><b>' + h(t.fecha) + '</b><span>' + cuando(t.faltan) + '</span></div><p>' + h(t.desc) + '</p></div>';
      }).join('') : '<p class="vacio">Sin tareas pendientes.</p>') +
      '<div class="acciones"><button class="sec" id="cActualizar">Volver a descargar</button></div></div>';
    $('cActualizar').onclick = function(){ Paquetes.olvidar(id); reemplazar(function(){ campoEnsayo(id); }); };
  }

  function abrirHoja(p){
    if (!p) return;
    if (!S.plan) return msg('Este ensayo no tiene actividades de muestreo.', 'info');
    S.parcela = p;
    var ya = S.hechas[clave(p.id)];
    var esCosecha = S.plan.tipo === 'COSECHA';
    $('cHoja').innerHTML = '<div class="agarre"></div><div class="cab"><div class="txt"><b>Parcela ' + h(p.num) + '</b>' +
      '<span>' + h(p.trat) + (p.bloque ? ' · bloque ' + h(p.bloque) : '') + (p.areaHa ? ' · ' + h(p.areaHa) + ' ha' : '') + '</span></div>' +
      '<button class="icono" id="hCerrar">×</button></div>' +
      (ya ? '<div class="ya">Esta parcela ya tiene datos de hoy. Si guarda otra vez se agrega otra medición.</div>' : '') +
      '<div class="tenue" style="font-size:13px;margin-top:8px">' + h(S.plan.actividad) + (S.plan.submuestras ? ' · ' + h(S.plan.submuestras) + ' submuestras: anote el promedio' : '') + '</div>' +
      S.plan.variables.map(function(v, i){
        return '<label>' + h(v.nombre) + (v.unidad ? ' (' + h(v.unidad) + ')' : '') + '</label>' +
          '<input type="number" inputmode="decimal" step="any" data-var="' + i + '" autocomplete="off">';
      }).join('') +
      '<label>Observación (opcional, va a la bitácora)</label><input id="hObs" placeholder="Algo que deba saberse de esta parcela">' +
      '<div class="botones"><button class="sec" id="hSig">Siguiente</button><button id="hGuardar">Guardar</button></div>';
    $('cHoja').className = 'hoja abierta';
    var primero = $('cHoja').querySelector('[data-var]');
    if (primero) setTimeout(function(){ primero.focus(); }, 150);
    $('hCerrar').onclick = cerrarHoja;
    $('hSig').onclick = function(){ siguiente(p); };
    $('hGuardar').onclick = function(){ guardar(p, esCosecha); };
    al('[data-var]', 'keydown', function(i, ev){
      if (ev.key !== 'Enter') return;
      var sig = $('cHoja').querySelector('[data-var="' + (Number(i.dataset.var) + 1) + '"]');
      sig ? sig.focus() : guardar(p, esCosecha);
    }, $('cHoja'));
  }
  function cerrarHoja(){ $('cHoja').className = 'hoja'; S.parcela = null; }

  function guardar(p, esCosecha){
    var valores = $$('[data-var]', $('cHoja')).map(function(i){ return { v: S.plan.variables[Number(i.dataset.var)], valor: i.value.trim() }; })
      .filter(function(x){ return x.valor !== ''; });
    var obs = val('hObs');
    if (!valores.length && !obs) return msg('Escriba al menos un valor.', 'err');
    var malo = valores.filter(function(x){ return isNaN(Number(x.valor.replace(',', '.'))); })[0];
    if (malo) return msg(h(malo.v.nombre) + ' debe ser un número.', 'err');

    var ahora = new Date(), base = { idEnsayo: id, idParcela: p.id, idPlan: S.plan.id, actividad: S.plan.actividad,
      fecha: ahora.toISOString(), fechaLocal: fechaHoyISO(), lat: S.mapa && S.mapa.ultima ? S.mapa.ultima.lat : '',
      lon: S.mapa && S.mapa.ultima ? S.mapa.ultima.lon : '' };
    var items = [];
    if (esCosecha) {
      var peso = valores.filter(function(x){ return /peso|kg/i.test(x.v.nombre + x.v.unidad); })[0];
      var hum = valores.filter(function(x){ return /humedad/i.test(x.v.nombre); })[0];
      if (peso) items.push(Object.assign({ uuid: uuid(), tipo: 'COSECHA', peso: peso.valor.replace(',', '.'), humedad: hum ? hum.valor : '', obs: obs }, base));
      valores.filter(function(x){ return x !== peso && x !== hum; }).forEach(function(x){
        items.push(Object.assign({ uuid: uuid(), tipo: 'MUESTREO', variable: x.v.nombre, unidad: x.v.unidad, valor: x.valor.replace(',', '.') }, base));
      });
    } else {
      valores.forEach(function(x){
        items.push(Object.assign({ uuid: uuid(), tipo: 'MUESTREO', variable: x.v.nombre, unidad: x.v.unidad, valor: x.valor.replace(',', '.') }, base));
      });
    }
    if (obs) items.push(Object.assign({ uuid: uuid(), tipo: 'NOTA', numParcela: p.num, detalle: S.plan.actividad + ' · parcela ' + p.num + ': ' + obs }, base));
    Cola.agregar(items);
    if (valores.length) S.hechas[clave(p.id)] = true;
    refrescar();
    msg('Parcela ' + h(p.num) + ' guardada en el teléfono.', 'ok');
    siguiente(p);
  }

  function siguiente(p){
    var l = S.paq.parcelas, i = l.indexOf(p);
    for (var k = 1; k <= l.length; k++) {
      var s = l[(i + k) % l.length];
      if (!S.hechas[clave(s.id)]) { if (S.mapa) S.mapa.irA(s); return abrirHoja(s); }
    }
    cerrarHoja();
    msg('Todas las parcelas tienen dato de ' + h(S.plan.actividad) + ' hoy.', 'ok');
  }
}
</script>
<script>
/* ===================================================================
 * VISTA DE EMPRESA: TODOS LOS DEPARTAMENTOS Y LOS TRASLAPES

function vistaEmpresa(){
  var cuerpo = armazon('Vista de empresa', 'Ensayos activos de todos los departamentos');

  api('empresa').then(function(r){

      '<p class="guia">' + h(r.alcance) + '. Aquí se ve quién trabaja en cada lote para no aplicar dos ensayos en el mismo ' +
      'lugar. Solo se muestran los datos para coordinarse; los datos de cada ensayo los ve su departamento.</p>' +
      '<div class="cifras">' + r.porDepartamento.map(function(d){ return cifra(d.ensayos, d.nombre); }).join('') +
        cifra(r.traslapes.length, 'lotes con traslape', r.traslapes.length ? 'alerta' : '') + '</div>' +
      (r.traslapes.length ? '<section class="seccion"><h2>Lotes con más de un ensayo activo</h2>' + r.traslapes.map(function(t){
        return '<div class="aviso-barra' + (t.departamentos > 1 ? ' rojo' : '') + '"><b>Lote ' + h(t.lote) + '</b> · ' + h(t.finca) +
          ' · zona ' + h(t.zona) + (t.desc ? ' · ' + h(t.desc) : '') + '<br>' + t.ensayos.map(function(e){
            return '«' + h(e.nombre) + '» de ' + h(e.deptoNombre) + ', aplicado ' + h(e.aplicacion || '—') + (e.responsable ? ' (' + h(e.responsable) + ')' : '');
          }).join('<br>') + '</div>';
      }).join('') + '</section>' : '<div class="aviso-barra ok">Ningún lote tiene dos ensayos activos al mismo tiempo.</div>') +
      '<section class="seccion"><h2>Mapa</h2><div class="acciones" style="margin:0 0 10px"><button class="sec" id="eMapa">Ver los lotes en el mapa</button></div>' +
        '<div id="eMapaCaja"></div></section>' +
      '<section class="seccion"><h2>Ensayos activos</h2><div class="filtros">' +
        '<input id="eTexto" placeholder="Buscar lote, finca o ensayo">' +
        '<select id="eDepto">' + opciones(r.porDepartamento.map(function(d){ return { v: d.id, t: d.nombre }; }), '', 'Todos los departamentos') + '</select>' +
        '<select id="eZona">' + opciones(r.porZona.map(function(z){ return { v: z.zona, t: 'Zona ' + z.zona + ' (' + z.ensayos + ')' }; }), '', 'Todas las zonas') + '</select>' +
      '</div><div id="eTabla"></div></section>';

    function tabla(){
      var q = filtro.texto.toLowerCase();
      var l = r.ensayos.filter(function(e){
        return (!filtro.depto || e.departamento === filtro.depto) &&
               (!filtro.zona || String(e.zonas).split(/,\s*/).indexOf(filtro.zona) >= 0) &&
               (!q || (e.nombre + ' ' + e.lotes + ' ' + e.fincas).toLowerCase().indexOf(q) >= 0);
      });
      $('eTabla').innerHTML = l.length ? '<div class="tabla-env"><table class="tabla"><tr><th>Ensayo</th><th>Departamento</th><th>Zona</th>' +
        '<th>Finca · lotes</th><th>Aplicación</th><th>Responsable</th><th>Estado</th></tr>' + l.map(function(e){
          return '<tr' + (e.propio ? ' class="clic" data-ens="' + h(e.id) + '"' : '') + '><td>' + h(e.nombre) + '</td>' +
            '<td><span class="chip" style="background:' + h(e.color) + '22;color:' + h(e.color) + '">' + h(e.deptoNombre) + '</span></td>' +
            '<td>' + h(e.zonas) + '</td><td>' + h(e.fincas) + '<br><span class="mono tenue">' + h(e.lotes) + '</span></td>' +
            '<td class="mono">' + h(e.aplicacion) + '</td><td>' + h(e.responsable) + '</td><td>' + chipEstado(e.estado) + '</td></tr>';
        }).join('') + '</table></div>' : '<p class="vacio">Sin ensayos con este filtro.</p>';
      al('[data-ens]', 'click', function(tr){ ir(function(){ vistaEnsayo(tr.dataset.ens); }); }, $('eTabla'));
    }
    $('eTexto').oninput = function(){ filtro.texto = this.value; tabla(); };
    $('eDepto').onchange = function(){ filtro.depto = this.value; tabla(); };
    $('eZona').onchange = function(){ filtro.zona = this.value; tabla(); };
    tabla();
    $('eMapa').onclick = function(){
      this.disabled = true;
      $('eMapaCaja').innerHTML = '<div class="mapa-caja"><div class="mapa" id="eMapaDiv"><div class="cargando">Cargando lotes…</div></div></div><div class="leyenda" id="eLey"></div>';
      Promise.all([api('empresaMapa'), cargarLeaflet()]).then(function(x){
        var fc = x[0], L = x[1];
        $('eMapaDiv').innerHTML = '';
        var mapa = L.map('eMapaDiv', { maxZoom: 20 });
        alSalir(function(){ mapa.remove(); });
        L.tileLayer('https://{s}.google.com/vt/lyrs=s,h&x={x}&y={y}&z={z}', { maxZoom: 20, subdomains: ['mt0', 'mt1', 'mt2', 'mt3'], attribution: 'Google' }).addTo(mapa);
        var capa = L.geoJSON(fc, {
          style: function(f){
            var n = f.properties.ensayos.length;
            return { color: n > 1 ? '#C0392B' : '#fff', weight: n > 1 ? 3 : 1.5, fillOpacity: .55,
                     fillColor: n > 1 ? '#C0392B' : (f.properties.ensayos[0] || {}).color || '#0D9440' };
          },
          onEachFeature: function(f, l){
            l.bindPopup('<b>Lote ' + h(f.properties.lote) + '</b> · ' + h(f.properties.finca) + '<br>' +
              f.properties.ensayos.map(function(e){ return h(e.nombre) + ' (' + h(e.depto) + ')'; }).join('<br>'));
          }
        }).addTo(mapa);
        if (fc.features.length) mapa.fitBounds(capa.getBounds(), { padding: [20, 20] }); else mapa.setView([14.2, -91.2], 11);
        $('eLey').innerHTML = r.porDepartamento.map(function(d){ return '<span><i style="background:' + h(d.color) + '"></i>' + h(d.nombre) + '</span>'; }).join('') +
          '<span><i style="background:#C0392B"></i>más de un ensayo</span>' +
          (fc.sinGeometria ? '<span class="tenue">' + fc.sinGeometria + ' lotes sin polígono en la capa</span>' : '');
      }).catch(function(e){ $('eMapaCaja').innerHTML = '<p class="vacio">' + h(e.message) + '</p>'; });
    };
  }).catch(function(e){ cuerpo.innerHTML = '<div class="vacio">' + h(e.message) + '</div>'; });
}

/* --------------------------- tablas editables --------------------------- */
function vistaTabla(nombre){
  var cuerpo = armazon('Configuración', '');
  var filtro = { depto: '', texto: '', inactivos: false };
  function cargar(){ api('tabla', nombre).then(pintar).catch(function(e){ cuerpo.innerHTML = '<div class="vacio">' + h(e.message) + '</div>'; }); }
  function pintar(t){
    armazon(t.titulo, 'Configuración');
    cuerpo = $('cuerpo');
    var colDepto = t.columnas.filter(function(c){ return c.c === 'DEPARTAMENTO' || c.c === 'LINEA'; })[0];
    var visibles = t.columnas.filter(function(c){ return !c.auto && c.c !== 'ORDEN' && c.c !== 'AYUDA'; }).slice(0, 7);
    cuerpo.innerHTML = '<p class="guia">' + h(t.ayuda) + '</p>' +
      '<div class="filtros"><input id="tTexto" placeholder="Buscar" value="' + h(filtro.texto) + '">' +
      (colDepto ? '<select id="tDepto">' + opciones(colDepto.op.filter(Boolean), filtro.depto, 'Todos los departamentos') + '</select>' : '') +
      '<label class="casilla"><input type="checkbox" id="tInact"' + (filtro.inactivos ? ' checked' : '') + '> ver inactivos</label>' +
      '<button id="tNuevo">Agregar</button></div><div id="tCuerpo"></div>';
    function lista(){
      var q = filtro.texto.toLowerCase();
      var filas = t.filas.filter(function(f){
        if (!filtro.inactivos && String(f.ACTIVO).toUpperCase() === 'NO') return false;
        if (colDepto && filtro.depto && f[colDepto.c] !== filtro.depto) return false;
        return !q || JSON.stringify(f).toLowerCase().indexOf(q) >= 0;
      });
      $('tCuerpo').innerHTML = filas.length ? '<div class="tabla-env"><table class="tabla"><tr>' +
        visibles.map(function(c){ return '<th>' + h(c.e) + '</th>'; }).join('') + '</tr>' + filas.map(function(f){
          return '<tr class="clic' + (String(f.ACTIVO).toUpperCase() === 'NO' ? ' inactivo' : '') + '" data-fila="' + f._fila + '">' +
            visibles.map(function(c){ return '<td>' + h(f[c.c]) + '</td>'; }).join('') + '</tr>';
        }).join('') + '</table></div><p class="guia" style="margin-top:8px">' + filas.length + ' de ' + t.filas.length + ' renglones. Toque uno para editarlo.</p>'
        : '<p class="vacio">Sin renglones con este filtro.</p>';
      al('[data-fila]', 'click', function(tr){ editar(t.filas.filter(function(f){ return String(f._fila) === tr.dataset.fila; })[0]); }, $('tCuerpo'));
    }
    $('tTexto').oninput = function(){ filtro.texto = this.value; lista(); };
    if ($('tDepto')) $('tDepto').onchange = function(){ filtro.depto = this.value; lista(); };
    $('tInact').onchange = function(){ filtro.inactivos = this.checked; lista(); };
    $('tNuevo').onclick = function(){ editar(null); };
    lista();

    function editar(f){
      var v = ventana(f ? 'Editar' : 'Agregar a ' + t.titulo.toLowerCase(), t.columnas.map(function(c){
        var actual = f ? f[c.c] : (c.c === 'DEPARTAMENTO' || c.c === 'LINEA' ? filtro.depto : (c.def === undefined ? '' : c.def));
        if (c.auto) return f ? '<label>' + h(c.e) + '</label><input value="' + h(actual) + '" disabled>' : '';
        var ctl = c.t === 'lista' ? '<select data-col="' + c.c + '">' + opciones(c.op.map(function(o){ return { v: o, t: o || '—' }; }), actual) + '</select>'
          : (c.c === 'VARIABLES' || c.c === 'AYUDA' || c.c === 'OPCIONES') ? '<textarea rows="2" data-col="' + c.c + '">' + h(actual) + '</textarea>'
          : '<input data-col="' + c.c + '" value="' + h(actual) + '"' + (c.t === 'numero' ? ' inputmode="decimal"' : '') + '>';
        return '<label>' + h(c.e) + (c.req ? ' *' : '') + '</label>' + ctl;
      }).join('') + '<div class="acciones"><button id="vGuardar">Guardar</button>' +
        (f ? '<button class="peligro" id="vBorrar">Eliminar</button>' : '') + '</div>' +
        (f ? '<p class="guia" style="margin-top:10px">Para dejar de usar un valor sin perder la historia, póngalo como inactivo en lugar de eliminarlo.</p>' : ''));
      $('vGuardar').onclick = function(){
        var datos = {}; $$('[data-col]', v.el).forEach(function(i){ datos[i.dataset.col] = i.value; });
        this.disabled = true;
        api('guardarFila', nombre, f ? f._fila : null, f ? f._firma : null, datos)
          .then(function(nt){ v.cerrar(); msg('Guardado en la hoja.', 'ok'); t = nt; pintar(nt); })
          .catch(function(e){ $('vGuardar').disabled = false; fallo(e); if (/Recargue/.test(e.message)) { v.cerrar(); cargar(); } });
      };
      if ($('vBorrar')) $('vBorrar').onclick = function(){
        if (!confirm('¿Eliminar este renglón de la hoja?')) return;
        api('eliminarFila', nombre, f._fila, f._firma).then(function(nt){ v.cerrar(); msg('Eliminado.', 'ok'); pintar(nt); })
          .catch(function(e){ fallo(e); if (/Recargue/.test(e.message)) { v.cerrar(); cargar(); } });
      };
    }
  }
  cargar();
}

/* ------------------------------ usuarios ------------------------------ */
function vistaUsuarios(){
  var cuerpo = armazon('Usuarios', 'Configuración');
  var notas = { ADMIN: 'Ve y hace todo, incluida la configuración.', JEFE: 'Ve todas las zonas de sus departamentos; crea ensayos y analiza.',
                ZONA: 'Ve solo los ensayos de sus zonas; crea ensayos en sus lotes y analiza.', CAMPO: 'Solo muestreo y cosecha. Con zonas, solo las suyas.' };
  function pintar(r){
    cuerpo.innerHTML = '<div class="acciones" style="margin:0 0 14px"><button id="uNuevo">Agregar usuario</button></div>' +
      '<div class="tabla-env"><table class="tabla"><tr><th>Usuario</th><th>Nombre</th><th>Rol</th><th>Departamentos</th><th>Zonas</th><th>Último acceso</th></tr>' +
      r.usuarios.map(function(u){
        return '<tr class="clic' + (u.activo ? '' : ' inactivo') + '" data-u="' + h(u.id) + '"><td class="mono">' + h(u.usuario) + '</td><td>' + h(u.nombre) + '</td>' +
          '<td>' + h((r.roles.filter(function(x){ return x.id === u.rol; })[0] || {}).nombre || u.rol) + '</td>' +
          '<td>' + h(u.rol === 'ADMIN' ? 'Todos' : u.departamentos.map(function(d){ return (r.departamentos.filter(function(x){ return x.id === d; })[0] || { nombre: d }).nombre; }).join(', ')) + '</td>' +
          '<td>' + h(u.zonas.join(', ') || (u.rol === 'ZONA' ? '¡falta!' : 'todas')) + '</td><td>' + h(u.ultimoAcceso || '—') + '</td></tr>';
      }).join('') + '</table></div>';
    $('uNuevo').onclick = function(){ formulario(null); };
    al('[data-u]', 'click', function(tr){ formulario(r.usuarios.filter(function(u){ return u.id === tr.dataset.u; })[0]); }, cuerpo);

    function formulario(u){
      u = u || { rol: 'ZONA', departamentos: [], zonas: [], activo: true };
      var v = ventana(u.id ? 'Editar ' + u.usuario : 'Usuario nuevo',
        '<div class="fila"><div><label>Usuario</label><input id="uUsuario" autocapitalize="none" value="' + h(u.usuario || '') + '"' + (u.id ? ' readonly' : '') + '></div>' +
        '<div><label>Nombre completo</label><input id="uNombre" value="' + h(u.nombre || '') + '"></div></div>' +
        '<label>Rol</label><select id="uRol">' + opciones(r.roles.map(function(x){ return { v: x.id, t: x.nombre }; }), u.rol) + '</select>' +
        '<span class="ayuda" id="uNota"></span>' +
        '<div id="uDeptosCaja"><label>Departamentos</label><div class="casillas">' + r.departamentos.map(function(d){
          return '<label class="casilla"><input type="checkbox" class="uDep" value="' + h(d.id) + '"' + (u.departamentos.indexOf(d.id) >= 0 ? ' checked' : '') + '>' + h(d.nombre) + '</label>';
        }).join('') + '</div></div>' +
        '<div id="uZonasCaja"><label>Zonas</label><div class="casillas">' + r.zonas.map(function(z){
          return '<label class="casilla"><input type="checkbox" class="uZona" value="' + h(z) + '"' + (u.zonas.indexOf(z) >= 0 ? ' checked' : '') + '>Zona ' + h(z) + '</label>';
        }).join('') + '</div><span class="ayuda" id="uZonaNota"></span></div>' +
        '<label>Correo</label><input id="uEmail" type="email" value="' + h(u.email || '') + '">' +
        '<div class="fila"><div><label>' + (u.id ? 'Clave nueva (opcional)' : 'Clave') + '</label><input id="uPin" placeholder="4 caracteres o más"></div>' +
        '<div><label>Estado</label><select id="uActivo">' + opciones([{ v: 'SI', t: 'Activo' }, { v: 'NO', t: 'Inactivo' }], u.activo ? 'SI' : 'NO') + '</select></div></div>' +
        '<div class="acciones"><button id="uGuardar">Guardar</button></div>');
      function ajustar(){
        var rol = val('uRol');
        $('uNota').textContent = notas[rol] || '';
        $('uDeptosCaja').className = rol === 'ADMIN' ? 'oculto' : '';
        $('uZonasCaja').className = (rol === 'ZONA' || rol === 'CAMPO') ? '' : 'oculto';
        $('uZonaNota').textContent = rol === 'CAMPO' ? 'Sin zonas marcadas, el técnico ve todas las zonas de sus departamentos.' : 'Marque al menos una.';
      }
      $('uRol').onchange = ajustar; ajustar();
      $('uGuardar').onclick = function(){
        var b = this; b.disabled = true;
        api('guardarUsuario', { id: u.id || '', usuario: val('uUsuario'), nombre: val('uNombre'), rol: val('uRol'),
          departamentos: $$('.uDep:checked', v.el).map(function(i){ return i.value; }),
          zonas: (val('uRol') === 'ZONA' || val('uRol') === 'CAMPO') ? $$('.uZona:checked', v.el).map(function(i){ return i.value; }) : [],
          email: val('uEmail'), pin: val('uPin'), activo: val('uActivo') === 'SI' })
          .then(function(nr){ v.cerrar(); msg(h(nr.mensaje), 'ok'); pintar(nr); })
          .catch(function(e){ b.disabled = false; fallo(e); });
      };
    }
  }
  api('usuarios').then(pintar).catch(function(e){ cuerpo.innerHTML = '<div class="vacio">' + h(e.message) + '</div>'; });
}

/* ------------------------------ soporte ------------------------------ */
function vistaSoporte(correo){
  var cuerpo = armazon('Soporte', 'Consultas de los usuarios');
  var todos = false;
  function pintar(r){
    cuerpo.innerHTML =
      '<section class="seccion"><h2>Correo que recibe las consultas</h2><div class="fila"><div style="flex:3 1 240px"><input id="sCorreoCfg" type="email" value="' + h(correo) + '"></div>' +
      '<div><button class="sec" id="sGuardarCfg">Guardar</button></div></div></section>' +
      '<section class="seccion"><h2>Consultas</h2>' +
      (r.casos.length ? r.casos.map(function(c){
        return '<div class="nota" style="margin-left:0"><div class="cab"><b>' + h(c.asunto) + '</b>' + chipEstado(c.estado) +
          '<span>' + h(c.tipo) + ' · ' + h(c.fecha) + ' · ' + h(c.nombre) + ' (' + h(c.usuario) + ')' + (c.pantalla ? ' · ' + h(c.pantalla) : '') + '</span></div>' +
          '<p>' + h(c.mensaje) + '</p>' + (c.respuesta ? '<p class="tenue">Respuesta: ' + h(c.respuesta) + '</p>' : '') +
          '<div class="acciones" style="margin-top:8px"><button class="sec chico" data-caso="' + h(c.id) + '">Responder</button></div></div>';
      }).join('') : '<p class="vacio">No hay consultas abiertas.</p>') + '</section>';
    $('sGuardarCfg').onclick = function(){
      api('guardarAjustes', { soporteEmail: val('sCorreoCfg') }).then(function(x){ correo = val('sCorreoCfg'); msg(h(x.mensaje), 'ok'); }).catch(fallo);
    };
    al('[data-caso]', 'click', function(b){
      var c = r.casos.filter(function(x){ return x.id === b.dataset.caso; })[0];
      var v = ventana('Responder a ' + c.nombre, '<p class="guia">' + h(c.mensaje) + '</p>' +
        '<label>Respuesta</label><textarea id="rTexto" rows="4">' + h(c.respuesta || '') + '</textarea>' +
        '<label>Estado</label><select id="rEstado">' + opciones([{ v: 'EN_PROCESO', t: 'En proceso' }, { v: 'RESUELTO', t: 'Resuelto' }], 'RESUELTO') + '</select>' +
        (c.email ? '<label class="casilla"><input type="checkbox" id="rNotif" checked> Enviar la respuesta a ' + h(c.email) + '</label>' : '<p class="guia">No dejó correo; responda por otro medio.</p>') +
        '<div class="acciones"><button id="rOk">Guardar</button></div>');
      $('rOk').onclick = function(){
        api('atenderCaso', c.id, { estado: val('rEstado'), respuesta: val('rTexto'), notificar: $('rNotif') ? $('rNotif').checked : false })
          .then(function(nr){ v.cerrar(); msg(h(nr.mensaje), 'ok'); pintar(nr); }).catch(fallo);
      };
    }, cuerpo);
  }
  api('casosSoporte', todos).then(pintar).catch(fallo);
}

/* ------------------------------- avisos ------------------------------- */
function vistaAvisos(estado){
  var cuerpo = armazon('Avisos automáticos', 'Configuración');
  cuerpo.innerHTML =
    '<div class="aviso-barra ' + (estado.diaria ? 'ok' : '') + '">' + (estado.diaria
      ? 'Los avisos están activos: cada día a las 6:00 a.m. se revisa el cronograma y se avisa por correo lo que viene.'
      : 'Los avisos están apagados. Actívelos para que cada día a las 6:00 a.m. se revise el cronograma y se avise por correo.') + '</div>' +
    '<p class="guia">A quién se avisa se define en Contactos para avisos, por tipo de actividad, departamento, zona o finca. ' +
    'El responsable de cada ensayo también recibe los avisos de su ensayo.</p>' +
    '<div class="acciones"><button id="aActivar">' + (estado.diaria ? 'Reinstalar avisos diarios' : 'Activar avisos diarios') + '</button>' +
    '<button class="sec" id="aAhora">Enviar ahora lo pendiente</button></div>';
  $('aActivar').onclick = function(){ this.disabled = true; api('activarAvisos').then(function(r){ msg(h(r.mensaje), 'ok'); reemplazar(function(){ vistaAvisos(r.avisos); }); }).catch(fallo); };
  $('aAhora').onclick = function(){ this.disabled = true; api('enviarAvisos').then(function(r){ msg(h(r.mensaje), 'ok'); }).catch(fallo); };
}

/* ==================== capa de lotes, fincas y cortes ==================== */
function vistaCapa(){
  var cuerpo = armazon('Capa de lotes', 'Configuración');
  api('admin').then(function(r){
    var b = r.base;
    cuerpo.innerHTML =
      (b.conGeometria ? '<div class="aviso-barra ok"><b>Capa cargada:</b> ' + b.lotes + ' lotes · ' + b.hectareas + ' ha · ' + b.fincas + ' fincas' +
        (b.actualizada ? ' · actualizada el ' + h(b.actualizada) : '') + (b.origen ? ' desde ' + h(b.origen) : '') + '</div>'
        : '<div class="aviso-barra"><b>Sin capa cargada.</b> Súbala para que los lotes se llenen solos y el mapa de campo funcione.</div>') +
      '<p class="guia">Suba el archivo a Drive —la capa completa pesa varios MB— y pegue aquí el enlace de <b>Compartir</b>. ' +
      'Acepta <code>.geojson</code> o un <code>.zip</code> con el shapefile. Al reemplazarla se conservan los nombres de finca y las zonas ya escritos.</p>' +
      '<label>Enlace o identificador del archivo en Drive</label><input id="kEnlace" placeholder="https://drive.google.com/file/d/…/view">' +
      '<div class="acciones"><button class="sec" id="kLeer">Leer archivo</button></div><div id="kMapeo"></div>';
    $('kLeer').onclick = function(){
      if (!val('kEnlace')) return msg('Pegue el enlace del archivo.', 'err');
      msg('Leyendo la capa…', 'info', true);
      api('inspeccionarCapa', val('kEnlace')).then(function(info){
        msg(info.n + ' polígonos en ' + h(info.archivo) + '.', 'ok');
        var defs = [['k_lote', 'Código de lote', /no_lote|^lote|plot/i, false], ['k_finca', 'Nombre de la finca', /desc_finca|nombre_finca/i, true],
          ['k_zona', 'Zona', /zona/i, true], ['k_desc', 'Descripción', /desc_lote|descripcion/i, true], ['k_sector', 'Sector', /^sector/i, true],
          ['k_canial', 'Cañal', /canial|cañal/i, true], ['k_variedad', 'Variedad', /varied/i, true], ['k_area', 'Área del ingenio', /area|área/i, true],
          ['k_dist', 'Distanciamiento', /dist|siemb/i, true], ['k_textura', 'Textura', /text/i, true], ['k_riego', 'Tipo de riego', /riego/i, true],
          ['k_cosecha', 'Tipo de cosecha', /^cosecha/i, true], ['k_estrato', 'Estrato', /estrat/i, true]];
        $('kMapeo').innerHTML = '<h3>Qué campo es cada cosa</h3><div class="fila">' + defs.map(function(d){
          var pre = info.campos.filter(function(c){ return d[2].test(c); })[0] || '';
          return '<div><label>' + d[1] + '</label><select id="' + d[0] + '">' + opciones(info.campos, pre, d[3] ? '— no usar —' : undefined) + '</select></div>';
        }).join('') + '</div><p class="guia" style="margin-top:10px">El área que usa el módulo es la calculada del polígono; la del ingenio se guarda aparte para comparar.</p>' +
          '<div class="acciones"><button id="kImportar">Reemplazar la capa</button></div>';
        $('kImportar').onclick = function(){
          if (!confirm('Esto reemplaza los lotes de la capa actual por los ' + info.n + ' del archivo. ¿Continuar?')) return;
          this.disabled = true; msg('Importando y calculando áreas… puede tardar un minuto.', 'info', true);
          var c = {}; defs.forEach(function(d){ c[d[0].substring(2)] = val(d[0]); });
          api('importarCapa', { enlace: val('kEnlace'), crs: 'AUTO', nombreArchivo: info.archivo, campos: c })
            .then(function(x){ msg(h(x.mensaje), 'ok', true); reemplazar(vistaCapa); }).catch(function(e){ $('kImportar').disabled = false; fallo(e); });
        };
      }).catch(fallo);
    };
  }).catch(fallo);
}

function vistaFincas(){
  var cuerpo = armazon('Fincas y zonas', 'Configuración');
  function pintar(fincas){
    cuerpo.innerHTML = '<p class="guia">El código de finca son los tres primeros dígitos del lote. Lo que escriba aquí se copia a todos ' +
      'los lotes de esa finca. La zona decide qué ensayos ve cada gerente de zona.</p>' +
      '<div class="tabla-env"><table class="tabla"><tr><th>Código</th><th>Nombre de la finca</th><th>Zona</th><th class="num">Lotes</th><th class="num">Hectáreas</th></tr>' +
      fincas.map(function(f){
        return '<tr' + (f.zona ? '' : ' class="pronto"') + '><td class="mono">' + h(f.cod) + '</td>' +
          '<td><input data-cod="' + h(f.cod) + '" data-c="nombre" value="' + h(f.nombre) + '"></td>' +
          '<td><input data-cod="' + h(f.cod) + '" data-c="zona" value="' + h(f.zona) + '" style="max-width:80px"></td>' +
          '<td class="num">' + f.lotes + '</td><td class="num">' + f.areaHa + '</td></tr>';
      }).join('') + '</table></div><div class="acciones"><button id="fGuardar">Guardar</button></div>';
    $('fGuardar').onclick = function(){
      var m = {};
      $$('[data-cod]', cuerpo).forEach(function(i){ m[i.dataset.cod] = m[i.dataset.cod] || { cod: i.dataset.cod }; m[i.dataset.cod][i.dataset.c] = i.value.trim(); });
      this.disabled = true;
      api('guardarFincas', Object.keys(m).map(function(k){ return m[k]; })).then(function(r){ msg(h(r.mensaje), 'ok'); pintar(r.fincas); }).catch(fallo);
    };
  }
  api('fincas').then(function(r){ pintar(r.fincas); }).catch(fallo);
}

function vistaCortes(){
  var cuerpo = armazon('Programa de corte', 'Configuración');
  cuerpo.innerHTML = '<p class="guia">Suba el programa que entrega cosecha (Excel o CSV). Las tareas y los avisos de cosecha salen de aquí: ' +
    'si cambian las fechas, las tareas se mueven solas.</p>' +
    '<label>Archivo</label><input type="file" id="cArch" accept=".csv,.xlsx,.xls,.txt">' +
    '<div class="acciones"><button class="sec" id="cLeer">Leer archivo</button></div><div id="cMapeo"></div>' +
    '<div id="cLista"><div class="cargando">Cargando programa vigente…</div></div>';
  var archivo = null;
  $('cLeer').onclick = function(){
    leerArchivo($('cArch'), 15).then(function(f){
      archivo = f; msg('Leyendo…', 'info');
      return api('importarCortes', { nombre: f.nombre, base64: f.base64, campos: null });
    }).then(function(r){
      if (!r.elegirCampos) return terminar(r);
      msg(r.filas + ' filas. Indique qué columna es cada cosa.', 'ok');
      function sel(id, patron, vacio){ return '<select id="' + id + '">' + opciones(r.campos, r.campos.filter(function(c){ return patron.test(c); })[0] || '', vacio ? '— no usar —' : undefined) + '</select>'; }
      $('cMapeo').innerHTML = '<div class="fila"><div><label>Lote</label>' + sel('kLote', /lote|plot/i) + '</div>' +
        '<div><label>Fecha de corte</label>' + sel('kFecha', /fecha|corte|date/i) + '</div><div><label>Zafra</label>' + sel('kZafra', /zafra|temporada/i, true) + '</div></div>' +
        '<div class="acciones"><button id="cSubir">Cargar programa</button></div>';
      $('cSubir').onclick = function(){
        this.disabled = true; msg('Cargando el programa y ajustando tareas…', 'info', true);
        api('importarCortes', { nombre: archivo.nombre, base64: archivo.base64, campos: { lote: val('kLote'), fecha: val('kFecha'), zafra: val('kZafra') } })
          .then(terminar).catch(function(e){ $('cSubir').disabled = false; fallo(e); });
      };
    }).catch(fallo);
  };
  function terminar(r){
    var extra = [];
    if (r.desconocidos) extra.push(r.desconocidos + ' lotes no están en la capa');
    if (r.invalidas) extra.push(r.invalidas + ' filas con fecha ilegible');
    msg(h(r.mensaje) + (extra.length ? '<br>' + extra.join(' · ') : ''), 'ok', true);
    $('cMapeo').innerHTML = ''; $('cArch').value = '';
    lista();
  }
  function lista(){
    api('cortes', '').then(function(r){
      $('cLista').innerHTML = r.total ? '<h3>Programa vigente' + (r.origen ? ' · ' + h(r.origen) : '') + '</h3>' +
        '<p class="guia">' + r.total + ' lotes programados' + (r.total > r.cortes.length ? '; se muestran los ' + r.cortes.length + ' más próximos' : '') + '.</p>' +
        '<div class="tabla-env"><table class="tabla"><tr><th>Fecha</th><th>Lote</th><th>Finca</th><th>Sector</th><th class="num">Hectáreas</th></tr>' +
        r.cortes.map(function(c){
          return '<tr' + (c.conocido ? '' : ' class="tarde"') + '><td class="mono">' + h(c.fecha) + '</td><td class="mono">' + h(c.lote) + '</td>' +
            '<td>' + h(c.finca || (c.conocido ? '' : 'lote fuera de la capa')) + '</td><td>' + h(c.desc) + '</td><td class="num">' + h(c.areaHa) + '</td></tr>';
        }).join('') + '</table></div>' : '<p class="vacio">Todavía no hay programa de corte cargado.</p>';
    }).catch(function(e){ $('cLista').innerHTML = ''; fallo(e); });
  }
  lista();
}
</script>
<script>
arrancar();
</script>
