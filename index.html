<!DOCTYPE html>
<html lang="es">
<head>
<base target="_top">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0D9440">
<title>Ensayos · Ingenio Madre Tierra</title>
<style>
  /* ============================ MARCA ============================ */
  :root{
    --verde:#0D9440; --verde-hover:#0A7A34; --lima:#8DB524; --verde-tenue:#E9F3DC;
    --ink:#2B2B2B; --texto:#4A4A4A; --tenue:#8A8A8A; --linea:#E4E7E4; --papel:#F7F8F7; --blanco:#fff;
    --ok:#0E8A3C; --acento:#B8860B; --ambar:#FFF6E3; --error:#C0392B; --rojo-tenue:#FBE9E7;
    --azul:#2F7FD6;
    --sombra:0 1px 3px rgba(0,0,0,.06), 0 4px 16px rgba(0,0,0,.04);
    --radio:10px;
    --mono:ui-monospace,Menlo,Consolas,monospace;
  }
  *{box-sizing:border-box}
  html,body{height:100%;margin:0}
  body{background:var(--papel);color:var(--ink);overflow:hidden;
       font:15px/1.5 -apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
       -webkit-tap-highlight-color:transparent}
  #app{display:flex;flex-direction:column;height:100vh;height:100dvh;overflow:hidden}
  h1{font-size:19px;margin:0;letter-spacing:-.2px}
  h2{font-size:12px;text-transform:uppercase;letter-spacing:.8px;color:var(--tenue);font-weight:700;margin:0 0 10px}
  h3{font-size:14px;margin:18px 0 8px;color:var(--ink)}
  a{color:var(--verde)}
  p.guia{margin:0 0 14px;color:var(--tenue);font-size:13px;max-width:68ch}
  .mono{font-family:var(--mono);font-size:12.5px}
  .tenue{color:var(--tenue)}
  .oculto{display:none!important}

  /* ========================== FORMULARIOS ========================== */
  label{display:block;font-size:11px;color:var(--tenue);margin:12px 0 4px;text-transform:uppercase;
        letter-spacing:.6px;font-weight:600}
  input,select,textarea{width:100%;padding:11px 12px;border:1px solid var(--linea);border-radius:8px;
        background:#fff;font:inherit;color:var(--ink);transition:border-color .15s}
  input:focus,select:focus,textarea:focus{outline:0;border-color:var(--verde);box-shadow:0 0 0 3px rgba(13,148,64,.13)}
  input[type=checkbox],input[type=radio]{width:auto;accent-color:var(--verde)}
  input[type=file]{padding:9px;background:var(--papel)}
  textarea{resize:vertical;min-height:70px}
  .fila{display:flex;gap:12px;flex-wrap:wrap}.fila>*{flex:1 1 160px;min-width:0}
  .ayuda{display:block;font-size:12px;color:var(--tenue);margin-top:3px;text-transform:none;letter-spacing:0;font-weight:400}
  .casillas{display:flex;flex-wrap:wrap;gap:8px 18px}
  .casilla{display:flex;align-items:center;gap:7px;text-transform:none;letter-spacing:0;font-size:14px;
           font-weight:400;color:var(--texto);margin:4px 0}

  /* ============================ BOTONES ============================ */
  button{background:var(--verde);color:#fff;border:0;border-radius:8px;padding:11px 18px;font:inherit;
         font-weight:600;cursor:pointer;transition:background .15s;touch-action:manipulation}
  button:hover{background:var(--verde-hover)}
  button.sec{background:#fff;color:var(--verde);border:1px solid var(--linea);font-weight:500}
  button.sec:hover{background:var(--verde-tenue);border-color:var(--verde)}
  button.peligro{background:#fff;color:var(--error);border:1px solid #F0C9C4;font-weight:500}
  button.peligro:hover{background:var(--rojo-tenue)}
  button.chico{padding:6px 12px;font-size:13px}
  button.icono{background:none;border:0;color:var(--tenue);padding:4px 8px;font-size:20px;line-height:1}
  button.icono:hover{background:none;color:var(--ink)}
  button[disabled]{opacity:.45;cursor:default}
  .acciones{margin-top:18px;display:flex;gap:10px;align-items:center;flex-wrap:wrap}

  /* ============================ ARMAZÓN ============================ */
  header.barra{flex:0 0 auto;background:#fff;border-bottom:3px solid var(--verde);display:flex;align-items:center;
    gap:10px;padding:10px 14px;padding-top:max(10px,env(safe-area-inset-top));box-shadow:0 1px 6px rgba(0,0,0,.04);z-index:20}
  header.barra .logo{height:38px;width:auto;flex:0 0 auto;cursor:pointer}
  header.barra .atras{background:none;border:0;color:var(--verde);font-size:30px;line-height:1;padding:0 6px 2px;flex:0 0 auto}
  header.barra .titulo{flex:1;min-width:0}
  header.barra .titulo b{display:block;font-size:16px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  header.barra .titulo span{display:block;font-size:11px;color:var(--verde);font-weight:600;text-transform:uppercase;
    letter-spacing:.6px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .yo{position:relative;flex:0 0 auto}
  .yo>button{background:var(--verde-tenue);color:var(--verde);border-radius:20px;padding:7px 12px;font-size:13px;
    display:flex;align-items:center;gap:6px;max-width:170px}
  .yo>button span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .menu{position:absolute;right:0;top:calc(100% + 6px);background:#fff;border:1px solid var(--linea);border-radius:10px;
    box-shadow:0 10px 30px rgba(0,0,0,.14);min-width:220px;padding:6px;z-index:60}
  .menu .quien{padding:8px 10px 10px;border-bottom:1px solid var(--linea);margin-bottom:4px}
  .menu .quien b{display:block;font-size:14px}.menu .quien span{font-size:12px;color:var(--tenue)}
  .menu button{display:block;width:100%;text-align:left;background:none;color:var(--ink);font-weight:500;padding:10px}
  .menu button:hover{background:var(--papel)}
  .contenido{flex:1 1 auto;min-height:0;overflow-y:auto;-webkit-overflow-scrolling:touch;overscroll-behavior:contain}
  .envoltura{max-width:1080px;margin:0 auto;padding:16px 16px 96px}
  .seccion{margin:0 0 24px}
  .cargando,.vacio{padding:36px 16px;color:var(--tenue);text-align:center}
  .cargando:before{content:'';display:block;width:26px;height:26px;margin:0 auto 12px;border-radius:50%;
    border:3px solid var(--verde-tenue);border-top-color:var(--verde);animation:gira .8s linear infinite}
  @keyframes gira{to{transform:rotate(360deg)}}

  /* ======================= TARJETAS Y CIFRAS ======================= */
  .cifras{display:grid;grid-template-columns:repeat(auto-fit,minmax(118px,1fr));gap:10px;margin-bottom:20px}
  .c{background:#fff;border:1px solid var(--linea);border-radius:var(--radio);padding:13px 14px;box-shadow:var(--sombra)}
  .c b{display:block;font:700 23px/1.1 -apple-system,"Segoe UI",Roboto,sans-serif;color:var(--verde)}
  .c span{font-size:11px;color:var(--tenue);text-transform:uppercase;letter-spacing:.5px}
  .c.alerta b{color:var(--error)} .c.aviso b{color:var(--acento)}
  .rejilla{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:10px}
  .accion{background:#fff;border:1px solid var(--linea);border-radius:var(--radio);padding:15px 14px;text-align:left;
    color:var(--ink);box-shadow:var(--sombra);transition:border-color .15s,transform .15s;position:relative;font-weight:400}
  .accion:hover:not([disabled]){background:#fff;border-color:var(--verde);transform:translateY(-1px)}
  .accion i{display:grid;place-items:center;width:36px;height:36px;border-radius:10px;background:var(--verde-tenue);
    color:var(--verde);font-style:normal;margin-bottom:9px}
  .accion i svg{width:20px;height:20px}
  .accion b{display:block;font-size:14.5px;margin-bottom:1px}
  .accion span{font-size:12px;color:var(--tenue);line-height:1.35;display:block}
  .accion em{position:absolute;top:10px;right:10px;font-style:normal;font-size:11px;font-weight:700;background:var(--error);
    color:#fff;border-radius:10px;padding:1px 8px}
  .depto{display:flex;align-items:center;gap:14px;width:100%;background:#fff;border:1px solid var(--linea);
    border-left:5px solid var(--verde);border-radius:var(--radio);padding:16px;text-align:left;color:var(--ink);
    box-shadow:var(--sombra);margin-bottom:10px;font-weight:400}
  .depto:hover{background:#fff;border-color:var(--verde)}
  .depto .ico{width:46px;height:46px;border-radius:12px;background:var(--verde-tenue);color:var(--verde);
    display:grid;place-items:center;flex:0 0 auto}
  .depto .ico svg{width:24px;height:24px}
  .depto .txt{flex:1;min-width:0}
  .depto b{display:block;font-size:16px}
  .depto .nums{display:flex;gap:14px;flex-wrap:wrap;font-size:12.5px;color:var(--tenue);margin-top:3px}
  .depto .nums i{font-style:normal;font-weight:700;color:var(--ink)}
  .depto .nums .rojo{color:var(--error)} .depto .nums .ambar{color:var(--acento)}
  .flecha{color:var(--tenue);font-size:22px}

  .aviso-barra{background:var(--ambar);border-left:4px solid var(--acento);border-radius:0 8px 8px 0;padding:11px 14px;
    font-size:13.5px;color:var(--texto);margin:0 0 14px;line-height:1.45}
  .aviso-barra.rojo{background:var(--rojo-tenue);border-left-color:var(--error)}
  .aviso-barra.ok{background:var(--verde-tenue);border-left-color:var(--verde)}
  .aviso-barra b{color:var(--ink)}
  .aviso-barra button{margin-top:8px}

  .ens{display:block;width:100%;text-align:left;background:#fff;border:1px solid var(--linea);border-radius:var(--radio);
    padding:14px 15px;margin-bottom:9px;color:var(--ink);box-shadow:var(--sombra);font-weight:400}
  .ens:hover{background:#fff;border-color:var(--verde)}
  .ens .arriba{display:flex;gap:8px;align-items:flex-start}
  .ens .arriba b{flex:1;font-size:15px;line-height:1.3}
  .ens .linea{display:block;font-size:13px;color:var(--tenue);margin-top:3px}
  .ens .prox{display:block;font-size:12.5px;margin-top:7px;color:var(--texto)}
  .ens .prox.tarde{color:var(--error)}
  .chip{display:inline-block;font-size:11px;padding:2px 9px;border-radius:10px;background:#EFF2EE;color:var(--tenue);
    font-weight:600;white-space:nowrap}
  .chip.planificado{background:#FFF6E3;color:var(--acento)}
  .chip.establecido,.chip.en_seguimiento,.chip.realizado{background:var(--verde-tenue);color:var(--verde)}
  .chip.cosechado,.chip.cerrado{background:#EAF0F5;color:#325C86}
  .chip.cancelado{background:var(--rojo-tenue);color:var(--error)}
  .chip.avisado{background:#EAF0F5;color:#325C86}
  .chip.rojo{background:var(--rojo-tenue);color:var(--error)}
  .chip.verde{background:var(--verde-tenue);color:var(--verde)}

  .filtros{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px}
  .filtros input,.filtros select{flex:1 1 150px;padding:9px 11px;font-size:14px}
  .pildoras{display:flex;gap:6px;overflow-x:auto;padding-bottom:4px;margin-bottom:12px}
  .pildora{background:#fff;border:1px solid var(--linea);color:var(--tenue);border-radius:18px;padding:7px 15px;
    font-size:13px;white-space:nowrap;font-weight:500}
  .pildora:hover{background:var(--verde-tenue);color:var(--verde)}
  .pildora.on{background:var(--verde);color:#fff;border-color:var(--verde)}

  /* ============================ TABLAS ============================ */
  .tabla-env{overflow-x:auto;-webkit-overflow-scrolling:touch;border:1px solid var(--linea);border-radius:8px;background:#fff}
  table.tabla{width:100%;border-collapse:collapse;font-size:13px}
  table.tabla th{font-size:10.5px;color:var(--tenue);font-weight:600;text-align:left;padding:10px 9px;
    border-bottom:1px solid var(--linea);text-transform:uppercase;letter-spacing:.5px;white-space:nowrap;background:#FBFCFB}
  table.tabla td{padding:8px 9px;border-bottom:1px solid #EEF1EE;vertical-align:top}
  table.tabla td .sub{display:block;font-size:11.5px;color:var(--tenue);margin-top:2px}
  table.tabla tr:last-child td{border-bottom:0}
  table.tabla td.num,table.tabla th.num{text-align:right;font-variant-numeric:tabular-nums}
  table.tabla tr.clic{cursor:pointer} table.tabla tr.clic:hover td{background:var(--verde-tenue)}
  table.tabla tr.tarde td{background:#FDF1EF} table.tabla tr.pronto td{background:#FFFAEC}
  table.tabla tr.hecho td{color:var(--tenue)} table.tabla tr.inactivo td{opacity:.5}
  table.tabla input,table.tabla select{padding:7px 9px;font-size:13px;border-radius:6px}
  .letra{color:var(--verde);font-size:15px}

  /* ============================ FICHA ============================ */
  .ficha{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:1px;background:var(--linea);
    border:1px solid var(--linea);border-radius:var(--radio);overflow:hidden;margin-bottom:18px}
  .ficha div{background:#fff;padding:11px 13px}
  .ficha span{display:block;font-size:10.5px;text-transform:uppercase;letter-spacing:.6px;color:var(--tenue);margin-bottom:2px}
  .ficha b{font-size:14px;font-weight:600;word-break:break-word}
  .texto-largo{background:#fff;border:1px solid var(--linea);border-radius:var(--radio);padding:13px 15px;
    margin-bottom:14px;white-space:pre-wrap;font-size:14px;color:var(--texto)}
  .pestanas{display:flex;gap:2px;overflow-x:auto;border-bottom:1px solid var(--linea);margin:0 0 16px;
    position:sticky;top:0;background:var(--papel);z-index:5}
  .pestanas button{background:none;color:var(--tenue);border:0;border-bottom:3px solid transparent;border-radius:0;
    padding:11px 13px;font-weight:600;font-size:14px;white-space:nowrap}
  .pestanas button.on{color:var(--verde);border-bottom-color:var(--verde)}
  .pestanas button:hover{background:none;color:var(--ink)}
  .lotes{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:10px}
  .lote{background:#fff;border:1px solid var(--linea);border-left:4px solid var(--verde);border-radius:var(--radio);
    padding:12px 14px;box-shadow:var(--sombra)}
  .lote.testigo{border-left-color:var(--lima)}
  .lote .cab{display:flex;align-items:center;gap:8px;margin-bottom:8px}
  .lote .cab b{font:700 15px var(--mono);flex:1}
  .lote .cab select{width:auto;padding:5px 8px;font-size:12px}
  .lote .datos{display:grid;grid-template-columns:1fr 1fr;gap:6px 12px}
  .lote .datos span{display:block;font-size:10px;text-transform:uppercase;letter-spacing:.5px;color:var(--tenue)}
  .lote .datos b{font-size:12.5px;font-weight:600}
  .lote .ocupado{margin-top:8px;font-size:12px;color:var(--acento);background:var(--ambar);padding:6px 8px;border-radius:6px}

  .linea-tiempo{border-left:2px solid var(--linea);margin-left:8px;padding-left:16px}
  .nota{position:relative;background:#fff;border:1px solid var(--linea);border-radius:8px;padding:11px 13px;margin-bottom:10px}
  .nota:before{content:'';position:absolute;left:-23px;top:15px;width:10px;height:10px;border-radius:50%;
    background:var(--verde);border:2px solid var(--papel)}
  .nota .cab{display:flex;gap:8px;align-items:center;flex-wrap:wrap;font-size:12px;color:var(--tenue)}
  .nota .cab b{color:var(--ink);font-size:13px}
  .nota p{margin:6px 0 0;white-space:pre-wrap;font-size:14px;color:var(--texto)}
  .nota .quitar{position:absolute;right:6px;top:6px}

  .archivo{display:flex;align-items:center;gap:12px;background:#fff;border:1px solid var(--linea);border-radius:8px;
    padding:10px 12px;margin-bottom:8px}
  .archivo .tipo{font:700 10px var(--mono);background:var(--verde-tenue);color:var(--verde);border-radius:6px;padding:8px 6px;
    min-width:58px;text-align:center}
  .archivo .txt{flex:1;min-width:0}
  .archivo .txt b{display:block;font-size:14px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .archivo .txt span{font-size:12px;color:var(--tenue)}

  .actividad{display:flex;gap:10px;align-items:flex-start;background:#fff;border:1px solid var(--linea);border-radius:8px;
    padding:10px 12px;margin-bottom:8px}
  .actividad input[type=checkbox]{margin-top:4px}
  .actividad .txt{flex:1;min-width:0}
  .actividad .txt b{font-size:14px}
  .actividad .txt span{display:block;font-size:12px;color:var(--tenue)}
  .actividad .txt span.tipo-act{display:inline-block}
  .actividad .nums{display:flex;gap:6px;flex-wrap:wrap;margin-top:6px}
  .actividad .nums label{margin:0;font-size:10px}
  .actividad .nums input{width:78px;padding:6px 8px;font-size:13px}
  .tipo-act{font-size:10px;font-weight:700;letter-spacing:.6px;border-radius:6px;padding:2px 7px;margin-left:6px}
  .tipo-act.MUESTREO{background:var(--verde-tenue);color:var(--verde)}
  .tipo-act.VUELO{background:#EAF0F5;color:#325C86}
  .tipo-act.COSECHA{background:var(--ambar);color:var(--acento)}

  .buscador{position:relative}
  .sugerencias{position:absolute;left:0;right:0;top:100%;z-index:40;background:#fff;border:1px solid var(--linea);
    border-radius:0 0 8px 8px;box-shadow:0 6px 20px rgba(0,0,0,.1);max-height:300px;overflow:auto}
  .sug{display:block;width:100%;text-align:left;background:#fff;border:0;border-bottom:1px solid var(--linea);
    padding:10px 13px;color:var(--ink);border-radius:0;font-weight:400}
  .sug:hover{background:var(--verde-tenue)}
  .sug b{font:600 13px var(--mono);margin-right:8px}
  .sug em{display:block;font-style:normal;font-size:12px;color:var(--tenue)}
  .lectura{background:var(--verde-tenue);border-left:3px solid var(--verde);padding:12px 14px;border-radius:0 6px 6px 0;
    font-size:14px;margin:0 0 16px;line-height:1.5}
  .hall{background:#fff;border:1px solid var(--linea);border-left:4px solid var(--tenue);border-radius:8px;padding:12px 14px;margin-bottom:8px}
  .hall.error{border-left-color:var(--error)} .hall.advertencia{border-left-color:#E8A317} .hall.info{border-left-color:var(--verde)}
  .hall b{font-size:13.5px} .hall span{display:block;font-size:11px;color:var(--tenue);text-transform:uppercase;letter-spacing:.5px}
  .hall p{margin:6px 0 0;font-size:13px;color:var(--texto)}

  /* ======================= MENSAJES Y VENTANAS ======================= */
  #aviso{position:fixed;left:12px;right:12px;bottom:calc(14px + env(safe-area-inset-bottom));z-index:3000;max-width:560px;
    margin:0 auto;border-radius:10px;padding:12px 40px 12px 14px;font-size:14px;box-shadow:0 6px 24px rgba(0,0,0,.18);
    display:none;line-height:1.45}
  #aviso.ok{display:block;background:#0E3B21;color:#fff} #aviso.err{display:block;background:var(--error);color:#fff}
  #aviso.info{display:block;background:#2B2B2B;color:#fff}
  #aviso a{color:#BFF0CF}
  #aviso .x{position:absolute;right:6px;top:6px;background:none;color:#fff;opacity:.7;font-size:20px;padding:2px 8px}
  .velo{position:fixed;inset:0;background:rgba(20,30,24,.45);z-index:2000;display:flex;align-items:flex-end;justify-content:center}
  @media (min-width:700px){.velo{align-items:center}}
  .ventana{background:#fff;width:100%;max-width:640px;max-height:92vh;max-height:92dvh;overflow-y:auto;
    border-radius:16px 16px 0 0;padding:4px 18px calc(20px + env(safe-area-inset-bottom));box-shadow:0 -6px 30px rgba(0,0,0,.2)}
  @media (min-width:700px){.ventana{border-radius:14px}}
  .ventana .cab{position:sticky;top:0;background:#fff;display:flex;align-items:center;gap:10px;padding:14px 0 10px;
    border-bottom:1px solid var(--linea);margin-bottom:6px;z-index:2}
  .ventana .cab b{flex:1;font-size:17px}
  .ventana iframe{width:100%;height:70vh;border:0;border-radius:8px}
  #soporteBtn{position:fixed;right:16px;bottom:calc(18px + env(safe-area-inset-bottom));z-index:1500;width:52px;height:52px;
    border-radius:26px;padding:0;font-size:22px;font-weight:700;box-shadow:0 4px 16px rgba(13,148,64,.4);display:none}
  #soporteBtn.ver{display:block}

  /* ============================ ACCESO ============================ */
  .acceso{flex:1;overflow-y:auto;display:flex;align-items:center;justify-content:center;padding:24px 18px}
  .caja{background:#fff;border-radius:14px;padding:30px 26px 22px;width:100%;max-width:380px;box-shadow:var(--sombra);text-align:center}
  .caja .logo{height:116px;width:auto;display:block;margin:0 auto 18px}
  .caja .pre{margin:0;font-size:16px;font-weight:700}
  .caja .titulo{font-size:25px;line-height:1.15;margin:2px 0 10px;font-weight:700}
  .caja .titulo em{font-style:normal;color:var(--verde);display:block}
  .caja .org{margin:0 0 18px;font-size:12.5px;color:var(--tenue)}
  .caja label{text-align:left}
  .caja input{padding:13px 14px;font-size:16px}
  .caja .clave{position:relative}.caja .clave input{padding-right:46px}
  .caja .ojo{position:absolute;right:4px;top:4px;bottom:4px;width:40px;background:none;color:var(--tenue);font-size:17px;padding:0}

  var o = {};

    var kv = p.split('='); if (kv[0]) o[decodeURIComponent(kv[0])] = decodeURIComponent(kv[1] || ''); }); } catch (e) {}

  set: function(k, v){ try { localStorage.setItem(k, JSON.stringify(v)); return true; } catch (e) { return false; } },
  del: function(k){ try { localStorage.removeItem(k); } catch (e) {} }

/* ------------------------- camino al servidor ------------------------- */
/**

 * google.script.run.api(); fuera, POST a /exec. La respuesta siempre llega

function llamarServidor(metodo, args){
  return new Promise(function(resolver, rechazar){
    var listo = false;
    var reloj = setTimeout(function(){ fin(new Error('El servidor no respondió. Revise la señal e intente de nuevo.')); }, ESPERA_MAXIMA);
    function fin(err, datos){
      if (listo) return; listo = true; clearTimeout(reloj);

        .withSuccessHandler(function(d){ fin(null, d); })
        .withFailureHandler(function(e){ fin(e instanceof Error ? e : new Error(String((e && e.message) || e))); })
        .api(metodo, args || []);

      .then(function(r){ return r.text(); })

function api(metodo){
  var args = [tokenGuardado()].concat([].slice.call(arguments, 1));

    if (String(e.message).indexOf('SESION_VENCIDA') >= 0) {

function h(v){
  return String(v === null || v === undefined ? '' : v).replace(/&/g, '&amp;').replace(/</g, '&lt;')
    .replace(/>/g, '&gt;').replace(/"/g, '&quot;').replace(/'/g, '&#39;');

  if (window.crypto && crypto.randomUUID) return crypto.randomUUID();

function msg(texto, tipo, fijo){

}

/** Lee un archivo elegido y lo entrega en base64. */
function leerArchivo(input, maxMB){
  return new Promise(function(resolver, rechazar){
    var f = input && input.files && input.files[0];
    if (!f) return rechazar(new Error('Elija un archivo.'));
    if (f.size > (maxMB || 20) * 1048576) return rechazar(new Error('El archivo pesa más de ' + (maxMB || 20) + ' MB.'));
    var r = new FileReader();
    r.onload = function(){ resolver({ nombre: f.name, mime: f.type || '', base64: String(r.result).split(',')[1], kb: Math.round(f.size / 1024) }); };
    r.onerror = function(){ rechazar(new Error('No se pudo leer el archivo.')); };
    r.readAsDataURL(f);
  });
}

/** Reduce una foto antes de subirla: en campo la señal es poca. */
function leerFoto(input){
  var f = input && input.files && input.files[0];
  if (!f) return Promise.resolve(null);
  if (!/^image\//.test(f.type)) return leerArchivo(input, 15);
  return new Promise(function(resolver){
    var img = new Image(), url = URL.createObjectURL(f);
    img.onload = function(){
      var esc = Math.min(1, 1600 / Math.max(img.width, img.height));
      var c = document.createElement('canvas');
      c.width = Math.round(img.width * esc); c.height = Math.round(img.height * esc);
      c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
      URL.revokeObjectURL(url);
      resolver({ nombre: f.name.replace(/\.[^.]+$/, '') + '.jpg', mime: 'image/jpeg',
                 base64: c.toDataURL('image/jpeg', 0.8).split(',')[1] });
    };
    img.onerror = function(){ resolver(leerArchivo(input, 15)); };
    img.src = url;
  });
}

 * Pila de navegación propia: la flecha regresa a la pantalla anterior.
 * Cada entrada es una función que vuelve a dibujar esa pantalla.

var PILA = [];

  if (PILA.length > 1) { PILA.pop(); PILA[PILA.length - 1](); }

  $('soporteBtn').className = SESION ? 'ver' : '';
  document.body.classList.toggle('en-campo', !!opciones.campo);
  PANTALLA_ACTUAL = titulo;
  return $('cuerpo');
}
var PANTALLA_ACTUAL = '';

function menuUsuario(e){
  e.stopPropagation();
  var viejo = document.querySelector('.menu');
  if (viejo) return viejo.parentNode.removeChild(viejo);
  var m = document.createElement('div');
  m.className = 'menu';
  m.innerHTML = '<div class="quien"><b>' + h(SESION.nombre) + '</b><span>' + h(SESION.rolNombre) +
    (SESION.zona ? ' · zona ' + h(SESION.zona) : '') + '</span></div>' +
    '<button data-m="inicio">Inicio</button>' +
    '<button data-m="clave">Cambiar mi clave</button>' +
    '<button data-m="soporte">Soporte</button>' +
    '<button data-m="salir">Salir</button>';
  $('btnYo').parentNode.appendChild(m);
  function cerrar(){ if (m.parentNode) m.parentNode.removeChild(m); document.removeEventListener('click', cerrar); }
  setTimeout(function(){ document.addEventListener('click', cerrar); }, 0);
  al('[data-m]', 'click', function(b){
    cerrar();
    ({ inicio: irInicio, clave: cambiarClave, soporte: abrirSoporte, salir: salir })[b.dataset.m]();
  }, m);
}

/** Abre una pantalla de contenido y deja la acción de regreso lista. */
function pantalla(titulo, subtitulo, cargar, opciones){
  var cuerpo = armazon(titulo, subtitulo, opciones);
  if (cargar) cargar(cuerpo);
  return cuerpo;
}

/** Botón-tarjeta de acción. */
function accion(id, icono, titulo, nota, badge){
  return '<button class="accion" data-ir="' + id + '"><i>' + icono + '</i><b>' + h(titulo) + '</b><span>' + h(nota || '') + '</span>' +
    (badge ? '<em>' + h(badge) + '</em>' : '') + '</button>';
}
function rutas(raiz, mapa){ al('[data-ir]', 'click', function(b){ if (mapa[b.dataset.ir]) mapa[b.dataset.ir](); }, raiz); }
function chipEstado(e){ return '<span class="chip ' + h(String(e || '').toLowerCase()) + '">' + h(String(e || '—').replace(/_/g, ' ')) + '</span>'; }
function etiquetaProceso(p){
  return { ESTABLECIMIENTO: 'Establecimiento', MUESTREO: 'Muestreo', VUELO_DRONE: 'Vuelo con dron', COSECHA: 'Cosecha',
           APLICACION: 'Aplicación', OTRO: 'Actividad' }[p] || p;
}
function cuando(faltan){
  if (faltan === null || faltan === undefined) return '';
  if (faltan === 0) return 'hoy';
  if (faltan === 1) return 'mañana';
  if (faltan < 0) return 'hace ' + (-faltan) + ' días';
  return 'en ' + faltan + ' días';
}
function cifra(n, txt, clase){ return '<div class="c ' + (clase || '') + '"><b>' + h(n) + '</b><span>' + h(txt) + '</span></div>'; }
function dato(k, v){ return '<div><span>' + h(k) + '</span><b>' + (v === '' || v === null || v === undefined ? '—' : h(v)) + '</b></div>'; }
function opciones(lista, actual, vacio){
  return (vacio !== undefined ? '<option value="">' + h(vacio) + '</option>' : '') + lista.map(function(o){
    var v = typeof o === 'object' ? o.v : o, t = typeof o === 'object' ? o.t : o;
    return '<option value="' + h(v) + '"' + (String(v) === String(actual) ? ' selected' : '') + '>' + h(t) + '</option>';
  }).join('');
}

<script>
/* ===================================================================
 * ACCESO, SOPORTE E INICIO SEGÚN EL ROL
 * =================================================================== */
function arrancar(){
  var t = tokenGuardado();
  if (!t) return vistaAcceso();
  app.innerHTML = '<div class="cargando" style="margin-top:30vh">Entrando…</div>';
  apiPublica('contextoSesion', t).then(function(r){
    if (!r.ok) { guardarToken(''); return vistaAcceso(); }
    SESION = r.sesion;
    Local.set('ens_sesion', SESION);
    entrar();
  }).catch(function(e){
    // Sin señal pero con sesión guardada: el técnico puede seguir capturando.
    var guardada = Local.get('ens_sesion', null);
    if (e.sinRed && guardada) { SESION = guardada; entrar(); msg('Sin señal: trabajando con lo descargado.', 'info'); }
    else vistaAcceso(e.sinRed ? 'Sin conexión con el servidor. Revise la señal.' : e.message);
  });
}

function entrar(){
  PILA = [];
  if (ENSAYO_INICIAL) {
    var id = ENSAYO_INICIAL; ENSAYO_INICIAL = '';
    if (puede('ver')) { PILA.push(inicioSegunRol); return ir(function(){ vistaEnsayo(id); }); }
    if (puede('capturar')) { PILA.push(inicioSegunRol); return ir(function(){ campoEnsayo(id); }); }
  }
  inicioSegunRol();
}

function vistaAcceso(mensaje){
  $('soporteBtn').className = '';
  app.className = '';
  app.innerHTML =
  '<div class="acceso"><div class="caja">' + LOGO +
    '<p class="pre">Módulo de</p>' +
    '<h1 class="titulo">Ensayos de<em>Investigación Agrícola</em></h1>' +
    '<p class="org">Ingenio Madre Tierra</p>' +
    '<label for="usuario">Usuario</label>' +
    '<input id="usuario" autocomplete="username" autocapitalize="none" spellcheck="false">' +
    '<label for="pin">Clave</label>' +
    '<div class="clave"><input id="pin" type="password" autocomplete="current-password">' +
    '<button type="button" class="ojo" id="verPin" aria-label="Mostrar clave">👁</button></div>' +
    '<button id="entrar">Ingresar</button>' +
    '<div class="msg-acceso" id="msgAcceso">' + h(mensaje || '') + '</div>' +
    '<button class="enlace" id="ayudaAcceso">¿Problemas para entrar?</button>' +
    '<p class="credito">Desarrollado por <b>Armando Reyes</b></p>' +
  '</div></div>';
  $('verPin').onclick = function(){ var c = $('pin'); c.type = c.type === 'password' ? 'text' : 'password'; c.focus(); };
  function hacer(){
    var u = val('usuario'), p = val('pin');
    if (!u || !p) { $('msgAcceso').textContent = 'Escriba usuario y clave.'; return; }
    $('entrar').disabled = true; $('msgAcceso').textContent = 'Verificando…';
    apiPublica('iniciarSesion', u, p, navigator.userAgent).then(function(r){
      if (!r.ok) { $('entrar').disabled = false; $('pin').value = ''; $('msgAcceso').textContent = r.error; return; }
      guardarToken(r.token); SESION = r.sesion; Local.set('ens_sesion', SESION);
      entrar();
    }).catch(function(e){ $('entrar').disabled = false; $('msgAcceso').textContent = e.message; });
  }
  $('entrar').onclick = hacer;
  $('pin').onkeydown = function(e){ if (e.key === 'Enter') hacer(); };
  $('ayudaAcceso').onclick = soporteSinSesion;
  $('usuario').focus();
}

function salir(){
  var t = tokenGuardado();
  var cola = Cola.pendientes();
  if (cola.length && !confirm('Hay ' + cola.length + ' datos de campo sin enviar en este teléfono. ' +
      'Si sale, se conservan y se enviarán cuando vuelva a entrar. ¿Salir?')) return;
  guardarToken(''); SESION = null; Local.del('ens_sesion');
  apiPublica('cerrarSesion', t).catch(function(){});
  vistaAcceso('Sesión cerrada.');
}

function cambiarClave(){
  var v = ventana('Cambiar mi clave',
    '<label>Clave actual</label><input id="cActual" type="password">' +
    '<label>Clave nueva</label><input id="cNueva" type="password">' +
    '<label>Repetir clave nueva</label><input id="cNueva2" type="password">' +
    '<div class="acciones"><button id="cGuardar">Guardar</button></div>');
  $('cGuardar').onclick = function(){
    if (val('cNueva') !== val('cNueva2')) return msg('Las claves nuevas no coinciden.', 'err');
    this.disabled = true;
    api('cambiarMiClave', val('cActual'), val('cNueva')).then(function(r){ v.cerrar(); msg(r.mensaje, 'ok'); })
      .catch(function(e){ $('cGuardar').disabled = false; fallo(e); });
  };
}

/* ------------------------------- soporte ------------------------------- */
function abrirSoporte(){
  var v = ventana('Soporte',
    '<p class="guia">Escriba su consulta o el problema que encontró. Le llega a quien administra la aplicación ' +
    'y le responderá a su correo.</p>' +
    '<div class="fila"><div><label>Tipo</label><select id="sTipo">' +
      opciones([{ v: 'PROBLEMA', t: 'Algo no funciona' }, { v: 'CONSULTA', t: 'Tengo una consulta' },
                { v: 'SUGERENCIA', t: 'Sugerencia' }]) + '</select></div>' +
    '<div><label>Correo para responderle</label><input id="sCorreo" type="email" value="' + h(SESION.email || '') + '"></div></div>' +
    '<label>Asunto</label><input id="sAsunto" maxlength="120">' +
    '<label>Mensaje</label><textarea id="sMensaje" rows="5" placeholder="Qué estaba haciendo, qué esperaba y qué pasó."></textarea>' +
    '<p class="guia" style="margin-top:8px">Pantalla: ' + h(PANTALLA_ACTUAL) + '</p>' +
    '<div class="acciones"><button id="sEnviar">Enviar</button></div>');
  $('sEnviar').onclick = function(){
    var b = this; b.disabled = true;
    api('soporte', { tipo: val('sTipo'), asunto: val('sAsunto'), mensaje: val('sMensaje'),
                     contacto: val('sCorreo'), pantalla: PANTALLA_ACTUAL })
      .then(function(r){ v.cerrar(); msg(h(r.mensaje), 'ok'); })
      .catch(function(e){ b.disabled = false; fallo(e); });
  };
}

function soporteSinSesion(){
  var v = ventana('¿Problemas para entrar?',
    '<p class="guia">Déjenos sus datos y le contactamos. Si olvidó su clave, quien administra la aplicación ' +
    'puede asignarle una nueva.</p>' +
    '<label>Su nombre</label><input id="pNombre">' +
    '<label>Usuario (si lo recuerda)</label><input id="pUsuario" autocapitalize="none" value="' + h(val('usuario')) + '">' +
    '<label>Correo o teléfono</label><input id="pContacto">' +
    '<label>Qué pasa</label><textarea id="pMensaje" rows="4"></textarea>' +
    '<div class="acciones"><button id="pEnviar">Enviar</button></div>');
  $('pEnviar').onclick = function(){
    var b = this; b.disabled = true;
    apiPublica('soporteSinSesion', { nombre: val('pNombre'), usuario: val('pUsuario'), contacto: val('pContacto'),
                                     mensaje: val('pMensaje') })
      .then(function(r){ v.cerrar(); $('msgAcceso').textContent = r.mensaje; })
      .catch(function(e){ b.disabled = false; msg(h(e.message), 'err'); });
  };
}
document.getElementById('soporteBtn').onclick = function(){ if (SESION) abrirSoporte(); };

/* --------------------------------- inicio --------------------------------- */
function inicioSegunRol(){
  if (!SESION) return vistaAcceso();
  if (SESION.alcance === 'CAMPO') { PILA = []; return ir(campoLista); }
  PILA = [];
  ir(vistaInicio);
}

function vistaInicio(){
  var cuerpo = armazon('Ingenio Madre Tierra', 'Módulo de ensayos');
  var copia = Local.get('ens_inicio', null);
  if (copia) pintar(copia);
  api('inicio').then(function(r){ Local.set('ens_inicio', r); pintar(r); })
    .catch(function(e){ if (!copia) cuerpo.innerHTML = '<div class="vacio">' + h(e.message) + '</div>'; fallo(e); });

  function pintar(r){
    var cfg = r.config, avisos = [];
    if (cfg && !cfg.capa) avisos.push('<b>Falta la capa de lotes.</b> Cárguela en Configuración ▸ Capa de lotes para ' +
      'que los lotes se llenen solos y el mapa de campo funcione.');
    if (cfg && !cfg.avisos) avisos.push('<b>Los avisos diarios están apagados.</b> Actívelos en Configuración ▸ Avisos.');
    if (cfg && cfg.casosNuevos) avisos.push('<b>' + cfg.casosNuevos + ' consulta(s) de soporte</b> sin atender.');
    var pend = Cola.pendientes().length;
    if (pend) avisos.push('<b>' + pend + ' datos de campo</b> esperan señal para enviarse desde este teléfono.');

    cuerpo.innerHTML =
      avisos.map(function(a){ return '<div class="aviso-barra">' + a + '</div>'; }).join('') +
      '<section class="seccion"><div class="rejilla">' +
        (puede('configurar') ? accion('config', IC.config, 'Configuración', 'lotes, catálogos, usuarios', cfg && cfg.casosNuevos ? cfg.casosNuevos : '') : '') +
        (puede('empresa') ? accion('empresa', IC.empresa, 'Vista de empresa', 'todos los ensayos y traslapes') : '') +
        (puede('capturar') ? accion('campo', IC.campo, 'Muestreo y cosecha', 'mapa y captura en campo', pend || '') : '') +
      '</div></section>' +
      '<section class="seccion"><h2>Departamentos</h2>' +
        (r.departamentos.length ? r.departamentos.map(function(d){
          var x = d.resumen;
          return '<button class="depto" data-depto="' + h(d.id) + '" style="border-left-color:' + h(d.color) + '">' +
            '<i class="ico">' + (IC[d.id] || IC.capa) + '</i><span class="txt"><b>' + h(d.nombre) + '</b>' +
            '<span class="nums"><span><i>' + x.ensayos + '</i> ensayos</span><span><i>' + x.activos + '</i> activos</span>' +
            '<span><i>' + x.hectareas + '</i> ha</span>' +
            (x.vencidas ? '<span class="rojo"><i class="rojo">' + x.vencidas + '</i> vencidas</span>' : '') +
            (x.proximas ? '<span class="ambar"><i class="ambar">' + x.proximas + '</i> esta semana</span>' : '') +
            '</span></span><span class="flecha">›</span></button>';
        }).join('') : '<p class="vacio">Su usuario no tiene departamentos asignados.</p>') +
      '</section>' +
      '<section class="seccion"><h2>Próximos 7 días' + (r.vencidas ? ' · ' + r.vencidas + ' vencidas' : '') + '</h2>' +
        (r.agenda.length ? '<div class="tabla-env"><table class="tabla"><tr><th>Cuándo</th><th>Actividad</th><th>Ensayo</th></tr>' +
          r.agenda.map(function(t){
            return '<tr class="clic ' + (t.faltan < 0 ? 'tarde' : t.faltan <= 2 ? 'pronto' : '') + '" data-ens="' + h(t.ensayo) + '">' +
              '<td class="mono">' + h(t.fecha) + '<br><span class="tenue">' + cuando(t.faltan) + '</span></td>' +
              '<td>' + h(t.desc) + '</td><td>' + h(t.nombreEnsayo) + '</td></tr>';
          }).join('') + '</table></div>'
          : '<p class="vacio">Nada programado para esta semana.</p>') +
      '</section>';

    rutas(cuerpo, {
      config: function(){ ir(vistaConfiguracion); },
      empresa: function(){ ir(vistaEmpresa); },
      campo: function(){ ir(campoLista); }
    });
    al('[data-depto]', 'click', function(b){ ir(function(){ vistaDepartamento(b.dataset.depto); }); }, cuerpo);
    al('[data-ens]', 'click', function(tr){ ir(function(){ vistaEnsayo(tr.dataset.ens); }); }, cuerpo);
  }
}
</script>
<script>
/* ===================================================================
 * DEPARTAMENTO: ENSAYOS, CRONOGRAMA, PROTOCOLOS Y ALTA DE ENSAYOS
 * =================================================================== */
var FILTRO_DEP = {};

function vistaDepartamento(id){
  var cuerpo = armazon('Departamento', '');
  api('departamento', id).then(function(r){
    var d = r.departamento, x = r.resumen;
    var f = FILTRO_DEP[id] = FILTRO_DEP[id] || { texto: '', estado: 'ACTIVOS', zona: '' };
    armazon(d.nombre, 'Departamento');
    cuerpo = $('cuerpo');
    cuerpo.innerHTML =
      '<div class="cifras">' + cifra(x.ensayos, 'ensayos') + cifra(x.activos, 'activos') + cifra(x.hectareas, 'hectáreas') +
        cifra(x.proximas, 'esta semana', 'aviso') + cifra(x.vencidas, 'vencidas', x.vencidas ? 'alerta' : '') + '</div>' +
      '<section class="seccion"><div class="rejilla">' +
        (puede('crear') ? accion('nuevo', IC.nuevo, 'Nuevo ensayo', 'lotes, tratamientos y plan') : '') +
        accion('cronograma', IC.calendario, 'Cronograma', 'tareas y avisos') +
        accion('campo', IC.campo, 'Muestreo y cosecha', 'mapa y captura') +
        accion('protocolos', IC.doc, 'Protocolos', 'repositorio del departamento') +
        (puede('analizar') ? accion('calidad', IC.revisar, 'Revisar datos', 'antes de analizar') : '') +
      '</div></section>' +
      '<section class="seccion"><h2>Ensayos</h2>' +
        '<div class="filtros"><input id="fTexto" placeholder="Buscar por nombre, lote o finca" value="' + h(f.texto) + '">' +
        '<select id="fEstado">' + opciones([{ v: 'ACTIVOS', t: 'Activos' }, { v: '', t: 'Todos los estados' }]
          .concat(r.estados.map(function(e){ return { v: e, t: e.replace(/_/g, ' ').toLowerCase() }; })), f.estado) + '</select>' +
        (r.zonas.length > 1 ? '<select id="fZona">' + opciones(r.zonas.map(function(z){ return { v: z, t: 'Zona ' + z }; }), f.zona, 'Todas las zonas') + '</select>' : '') +
        '</div><div id="listaEns"></div></section>';

    function pintarLista(){
      var q = f.texto.toLowerCase();
      var lista = r.ensayos.filter(function(e){
        if (f.estado === 'ACTIVOS' && ['PLANIFICADO', 'ESTABLECIDO', 'EN_SEGUIMIENTO'].indexOf(e.estado) < 0) return false;
        if (f.estado && f.estado !== 'ACTIVOS' && e.estado !== f.estado) return false;
        if (f.zona && String(e.zonas).split(/,\s*/).indexOf(f.zona) < 0) return false;
        return !q || (e.nombre + ' ' + e.lotes + ' ' + e.fincas + ' ' + e.tipo + ' ' + e.id).toLowerCase().indexOf(q) >= 0;
      });
      $('listaEns').innerHTML = lista.length ? lista.map(tarjetaEnsayo).join('')
        : '<p class="vacio">' + (r.ensayos.length ? 'Ningún ensayo coincide con el filtro.' : 'Todavía no hay ensayos que pueda ver en este departamento.') + '</p>';
      al('[data-ens]', 'click', function(b){ ir(function(){ vistaEnsayo(b.dataset.ens); }); }, $('listaEns'));
    }
    $('fTexto').oninput = function(){ f.texto = this.value; pintarLista(); };
    $('fEstado').onchange = function(){ f.estado = this.value; pintarLista(); };
    if ($('fZona')) $('fZona').onchange = function(){ f.zona = this.value; pintarLista(); };
    pintarLista();
    rutas(cuerpo, {
      nuevo: function(){ ir(function(){ vistaNuevoEnsayo(id); }); },
      cronograma: function(){ ir(function(){ vistaCronograma(id); }); },
      campo: function(){ CAMPO_FILTRO = id; ir(campoLista); },
      protocolos: function(){ ir(function(){ vistaProtocolos(id, d.nombre); }); },
      calidad: function(){ ir(function(){ vistaCalidad(''); }); }
    });
  }).catch(function(e){ cuerpo.innerHTML = '<div class="vacio">' + h(e.message) + '</div>'; });
}

function tarjetaEnsayo(e){
  var p = e.proxima;
  return '<button class="ens" data-ens="' + h(e.id) + '">' +
    '<span class="arriba"><b>' + h(e.nombre) + '</b>' + chipEstado(e.estado) + '</span>' +
    '<span class="linea">' + h([e.tipo, e.fincas, 'lotes ' + e.lotes].filter(Boolean).join(' · ')) + '</span>' +
    '<span class="linea">' + (e.zonas ? 'Zona ' + h(e.zonas) + ' · ' : '') + 'aplicado ' + h(e.aplicacion || '—') +
      (e.dda !== null && e.dda >= 0 ? ' · ' + e.dda + ' DDA' : '') + (e.responsable ? ' · ' + h(e.responsable) : '') + '</span>' +
    (e.vencidas ? '<span class="prox tarde">' + e.vencidas + ' tarea(s) vencida(s)</span>' : '') +
    (p ? '<span class="prox">Próximo: ' + h(p.desc) + ' · ' + h(p.fecha) + ' (' + cuando(p.faltan) + ')</span>' : '') +
  '</button>';
}

/* ----------------------------- cronograma ----------------------------- */
function vistaCronograma(depto, idEnsayo){
  var estado = 'ABIERTAS';
  var cuerpo = armazon('Cronograma', idEnsayo ? 'Ensayo ' + idEnsayo : 'Tareas y avisos');
  function cargar(){
    cuerpo.innerHTML = '<div class="cargando">Cargando tareas…</div>';
    api('tareas', { departamento: depto || '', ensayo: idEnsayo || '', estado: estado }).then(function(t){
      cuerpo.innerHTML =
        '<div class="filtros"><select id="tEstado">' + opciones([{ v: 'ABIERTAS', t: 'Pendientes' }, { v: '', t: 'Todas' },
          { v: 'REALIZADO', t: 'Realizadas' }], estado) + '</select>' +
        (puede('crear') ? '<button class="sec" id="tAvisar">Enviar avisos pendientes</button>' : '') + '</div>' +
        (t.length ? '<div class="tabla-env"><table class="tabla"><tr><th>Fecha</th><th>Actividad</th><th>Estado</th></tr>' + t.map(function(x){
            var cls = x.estado === 'REALIZADO' ? 'hecho' : (x.faltan !== null && x.faltan < 0) ? 'tarde' : (x.faltan !== null && x.faltan <= 7) ? 'pronto' : '';
            return '<tr class="' + cls + '"><td class="mono">' + h(x.fecha) + '<br><span class="tenue">' + cuando(x.faltan) + '</span></td>' +
              '<td>' + h(x.desc) + '<span class="sub"><a href="#" data-ens="' + h(x.ensayo) + '">' + h(x.nombreEnsayo) + '</a> · avisa a ' +
                h(x.responsables || 'nadie todavía') + '</span></td>' +
              '<td>' + chipEstado(x.estado) + (['PENDIENTE', 'AVISADO'].indexOf(x.estado) >= 0 ? '<br><button class="sec chico" style="margin-top:6px" data-hecha="' + h(x.id) + '">Realizada</button>' : '') + '</td></tr>';
          }).join('') + '</table></div>' : '<p class="vacio">No hay tareas en esta vista.</p>');
      $('tEstado').onchange = function(){ estado = this.value; cargar(); };
      if ($('tAvisar')) $('tAvisar').onclick = function(){
        this.disabled = true;
        api('enviarAvisos').then(function(r){ msg(h(r.mensaje), 'ok'); cargar(); }).catch(fallo);
      };
      al('[data-hecha]', 'click', function(b){
        b.disabled = true;
        api('completarTarea', b.dataset.hecha).then(function(r){ msg(r.mensaje, 'ok'); cargar(); }).catch(fallo);
      }, cuerpo);
      al('[data-ens]', 'click', function(a, ev){ ev.preventDefault(); ir(function(){ vistaEnsayo(a.dataset.ens); }); }, cuerpo);
    }).catch(fallo);
  }
  cargar();
}

/* ------------------------- revisión de calidad ------------------------- */
function vistaCalidad(idEnsayo){
  var cuerpo = armazon('Revisión de datos', idEnsayo ? 'Ensayo ' + idEnsayo : 'Antes de analizar');
  api('revisarCalidad', idEnsayo || '').then(function(r){
    var orden = { ERROR: 0, ADVERTENCIA: 1, INFO: 2 };
    var hs = r.hallazgos.slice().sort(function(a, b){ return orden[a.nivel] - orden[b.nivel]; });
    cuerpo.innerHTML = '<div class="cifras">' + cifra(r.errores, 'bloquean el análisis', r.errores ? 'alerta' : '') +
      cifra(r.advertencias, 'advertencias', 'aviso') + cifra(hs.length, 'hallazgos') + '</div>' +
      (hs.length ? hs.map(function(x){
        return '<div class="hall ' + h(x.nivel.toLowerCase()) + '"><b>' + h(x.detalle) + '</b><span>' + h(x.ambito) +
          (x.ensayo ? ' · ' + h(x.ensayo) : '') + '</span><p>' + h(x.sugerencia) + '</p></div>';
      }).join('') : '<p class="vacio">No se encontraron inconsistencias.</p>');
  }).catch(function(e){ cuerpo.innerHTML = ''; fallo(e); });
}

/* --------------------- repositorio de protocolos --------------------- */
function vistaProtocolos(depto, nombre){
  var cuerpo = armazon('Protocolos', nombre);
  function pintar(lista){
    cuerpo.innerHTML =
      '<p class="guia">Protocolos generales del departamento. Los de cada ensayo se guardan en la pestaña Archivos del ensayo.</p>' +
      (puede('crear') ? '<section class="seccion"><h2>Subir</h2><div class="fila">' +
        '<div><label>Título</label><input id="aTitulo"></div><div><label>Archivo</label><input type="file" id="aArchivo"></div></div>' +
        '<div class="acciones"><button id="aSubir">Subir</button></div></section>' : '') +
      '<section class="seccion"><h2>Documentos</h2>' + listaArchivos(lista, puede('crear')) + '</section>';
    if ($('aSubir')) $('aSubir').onclick = function(){
      var b = this;
      leerArchivo($('aArchivo')).then(function(f){
        b.disabled = true; msg('Subiendo…', 'info');
        return api('subirArchivo', { departamento: depto, tipo: 'PROTOCOLO', titulo: val('aTitulo'), nombre: f.nombre,
                                     mime: f.mime, base64: f.base64 });
      }).then(function(r){ msg(h(r.mensaje), 'ok'); pintar(r.archivos); }).catch(function(e){ b.disabled = false; fallo(e); });
    };
    cablearArchivos(cuerpo, function(r){ pintar(r.archivos); });
  }
  api('archivosDepartamento', depto).then(function(r){ pintar(r.archivos); }).catch(fallo);
}

function listaArchivos(lista, borrar){
  if (!lista.length) return '<p class="vacio">Todavía no hay archivos.</p>';
  return lista.map(function(a){
    return '<div class="archivo"><span class="tipo">' + h(a.tipo.replace('SHP_PARCELAS', 'SHP')) + '</span>' +
      '<span class="txt"><b>' + h(a.titulo) + '</b><span>' + h(a.nombre) + ' · ' + h(a.kb) + ' KB · ' + h(a.por) + ' · ' + h(a.fecha) + '</span></span>' +
      '<button class="sec chico" data-ver="' + h(a.idDrive) + '" data-url="' + h(a.url) + '" data-titulo="' + h(a.titulo) + '">Ver</button>' +
      (borrar ? '<button class="icono" data-borrar-arch="' + h(a.id) + '" title="Eliminar">×</button>' : '') + '</div>';
  }).join('');
}

function cablearArchivos(raiz, alBorrar){
  al('[data-ver]', 'click', function(b){
    ventana(b.dataset.titulo, '<iframe src="https://drive.google.com/file/d/' + encodeURIComponent(b.dataset.ver) + '/preview"></iframe>' +
      '<div class="acciones"><a href="' + h(b.dataset.url) + '" target="_blank" rel="noopener">Abrir en Drive o descargar</a></div>');
  }, raiz);
  al('[data-borrar-arch]', 'click', function(b){
    if (!confirm('¿Eliminar este archivo? Se manda a la papelera de Drive.')) return;
    api('eliminarArchivo', b.dataset.borrarArch).then(function(r){ msg(h(r.mensaje), 'ok'); alBorrar(r); }).catch(fallo);
  }, raiz);
}

/* =========================== NUEVO ENSAYO =========================== */
/**
 * El lote manda: al agregarlo se llenan finca, zona, variedad, área y
 * riego, y se avisa si otro departamento ya tiene un ensayo activo ahí.
 * El seguimiento se elige de las plantillas del departamento, que ya
 * traen días, frecuencia y variables; se pueden ajustar aquí.
 */
function vistaNuevoEnsayo(depto){
  var NE = { lotes: [], form: null };
  var cuerpo = armazon('Nuevo ensayo', '');
  api('formularioEnsayo', depto, '').then(function(f){
    NE.form = f;
    armazon('Nuevo ensayo', (SESION.departamentos.filter(function(d){ return d.id === depto; })[0] || {}).nombre || depto);
    cuerpo = $('cuerpo');
    cuerpo.innerHTML =
    '<section class="seccion"><h2>Identificación</h2>' +
      '<div class="fila"><div style="flex:2 1 240px"><label>Nombre del ensayo *</label><input id="nNombre" maxlength="120"></div>' +
      '<div><label>Tipo de ensayo</label><select id="nTipo">' + opciones(f.tipos, '', f.tipos.length ? undefined : 'sin tipos en el catálogo') + '</select></div></div>' +
      '<label>Descripción</label><textarea id="nDesc" rows="2" placeholder="Qué se prueba y por qué"></textarea>' +
      '<label>Objetivo</label><textarea id="nObjetivo" rows="2"></textarea>' +
    '</section>' +

    '<section class="seccion"><h2>Lotes</h2>' +
      '<p class="guia">Escriba el código, el sector o la finca. Al agregar el lote se llenan solos la finca, la zona, la variedad y el área.' +
      (f.soloZonas ? ' Solo aparecen lotes de su zona (' + h(f.soloZonas.join(', ')) + ').' : '') + '</p>' +
      '<div class="buscador"><input id="nBusca" placeholder="Ej.: 0010501, Jocotales, Madre Tierra…" autocomplete="off">' +
      '<div id="nSug" class="sugerencias"></div></div>' +
      '<div id="nLotes" class="lotes" style="margin-top:12px"></div><div id="nResumen" class="guia" style="margin-top:10px"></div>' +
    '</section>' +

    '<section class="seccion"><h2>Diseño y tratamientos</h2>' +
      '<div class="fila"><div><label>Arreglo</label><select id="nDiseno">' + opciones([
        { v: 'BLOQUES', t: 'Bloques al azar' }, { v: 'FRANJAS', t: 'Franjas' }, { v: 'LOTES_COMERCIALES', t: 'Lotes comerciales' },
        { v: 'DCA', t: 'Completamente al azar' }], 'BLOQUES') + '</select></div>' +
      '<div><label>Repeticiones</label><input id="nReps" type="number" value="4" min="1"></div>' +
      '<div><label>Área de parcela (m²)</label><input id="nArea" type="number" step="0.01"></div>' +
      '<div><label>Surcos de borde</label><input id="nSurcos" type="number" min="0" placeholder="por lado"></div></div>' +
      '<div id="nAvisoDiseno"></div>' +
      '<label style="margin-top:14px">Tratamientos</label>' +
      '<div class="tabla-env"><table class="tabla" id="nTrat"><tr><th style="width:80px">Código</th><th>Descripción</th>' +
        '<th>Producto</th><th style="width:110px">Dosis</th><th style="width:60px">Testigo</th><th style="width:30px"></th></tr></table></div>' +
      '<div class="acciones" style="margin-top:8px"><button class="sec chico" id="nMasTrat">Agregar tratamiento</button></div>' +
    '</section>' +

    '<section class="seccion"><h2>Aplicación</h2>' +
      '<div class="fila"><div><label>Fecha de aplicación *</label><input id="nFecha" type="date" value="' + fechaHoyISO() + '"></div>' +
      '<div><label>Equipo de aplicación</label><select id="nEquipo">' + opciones(f.equipos, '', '—') + '</select></div>' +
      '<div><label>¿Llega a cosecha?</label><select id="nCosecha">' + opciones([{ v: 'SI', t: 'Sí' }, { v: 'NO', t: 'No' }], 'SI') + '</select></div></div>' +
      '<p class="guia" style="margin-top:8px">Todo el cronograma se cuenta en días después de esta fecha (DDA).</p>' +
    '</section>' +

    '<section class="seccion"><h2>Muestreos, vuelos y cosecha</h2>' +
      '<p class="guia">Marque lo que lleva este ensayo. Los días vienen del catálogo del departamento; ajústelos si este ensayo lo pide.</p>' +
      '<div id="nPlan"></div>' +
    '</section>' +

    '<section class="seccion" id="nCampos"></section>' +

    '<section class="seccion"><h2>Responsable</h2><div class="fila">' +
      '<div><label>Nombre</label><input id="nResp" value="' + h(SESION.nombre) + '"></div>' +
      '<div><label>Correo para los avisos</label><input id="nEmail" type="email" value="' + h(SESION.email || '') + '"></div></div>' +
    '</section>' +

    '<section class="seccion"><h2>Documentos (opcional)</h2>' +
      '<p class="guia">Se suben al terminar de crear el ensayo. El shapefile o GeoJSON de parcelas se enlaza en el paso siguiente.</p>' +
      '<div class="fila"><div><label>Protocolo (PDF)</label><input type="file" id="nProt" accept=".pdf,application/pdf"></div>' +
      '<div><label>Croquis (imagen o PDF)</label><input type="file" id="nCroq" accept="image/*,.pdf"></div>' +
      '<div><label>Parcelas (.zip con SHP, .geojson, .kml)</label><input type="file" id="nShp" accept=".zip,.geojson,.json,.kml,.kmz"></div></div>' +
    '</section>' +

    '<div class="acciones"><button id="nCrear">Crear ensayo</button><button class="sec" id="nCancelar">Cancelar</button></div>';

    filaTrat('T1', 'Testigo', true); filaTrat('T2'); filaTrat('T3');
    $('nMasTrat').onclick = function(){ filaTrat('T' + ($$('#nTrat tr').length)); };
    $('nDiseno').onchange = avisoDiseno; avisoDiseno();
    $('nTipo').onchange = cargarCampos; cargarCampos();
    $('nCancelar').onclick = atras;
    pintarPlan();
    cablearBuscador();
    $('nCrear').onclick = crear;
  }).catch(function(e){ cuerpo.innerHTML = '<div class="vacio">' + h(e.message) + '</div>'; });

  function filaTrat(cod, desc, testigo){
    var tr = $('nTrat').insertRow(-1);
    tr.innerHTML = '<td><input class="tCod" value="' + h(cod || '') + '"></td><td><input class="tDesc" value="' + h(desc || '') + '"></td>' +
      '<td><input class="tProd" list="nProductos"></td><td><input class="tDosis"></td>' +
      '<td style="text-align:center"><input type="checkbox" class="tTest"' + (testigo ? ' checked' : '') + '></td>' +
      '<td><button class="icono">×</button></td>';
    tr.querySelector('.icono').onclick = function(){ tr.parentNode.removeChild(tr); };
    if (!$('nProductos') && NE.form.productos.length) {
      var dl = document.createElement('datalist'); dl.id = 'nProductos';
      dl.innerHTML = opciones(NE.form.productos); document.body.appendChild(dl);
    }
  }

  function avisoDiseno(){
    var d = val('nDiseno');
    $('nReps').disabled = (d === 'LOTES_COMERCIALES');
    $('nAvisoDiseno').innerHTML = (d === 'LOTES_COMERCIALES' || d === 'FRANJAS')
      ? '<div class="aviso-barra" style="margin-top:12px">En este arreglo los tratamientos no se repiten dentro del lote: no hay ' +
        'error experimental que estimar y el ANOVA no aplica. La comparación se hace contra un lote testigo; agréguelo ' +
        'arriba y márquelo como testigo.</div>' : '';
  }

  function cargarCampos(){
    api('formularioEnsayo', depto, val('nTipo')).then(function(f){
      $('nCampos').innerHTML = f.secciones.length ? f.secciones.map(function(s){
        return '<h2>' + h(s.seccion) + '</h2><div class="fila">' + s.campos.map(campoHTML).join('') + '</div>';
      }).join('') : '';
    }).catch(fallo);
  }

  function pintarPlan(){
    var grupos = { MUESTREO: 'Muestreos', VUELO: 'Vuelos con dron', COSECHA: 'Cosecha' };
    var pl = NE.form.plantillas;
    $('nPlan').innerHTML = pl.length ? Object.keys(grupos).map(function(g){
      var de = pl.filter(function(p){ return p.tipo === g; });
      if (!de.length) return '';
      return '<h3>' + grupos[g] + '</h3>' + de.map(function(p){
        var sinDias = p.dias === '' || p.dias === null;
        return '<div class="actividad"><input type="checkbox" data-plantilla="' + h(p.id) + '"' + (g === 'COSECHA' ? ' checked' : '') + '>' +
          '<div class="txt"><b>' + h(p.nombre) + '</b><span class="tipo-act ' + g + '">' + g + '</span>' +
          '<span>' + h(p.variables || 'sin variables definidas') + '</span>' +
          (sinDias && g === 'COSECHA' ? '<span>La fecha la pone el programa de corte del ingenio.</span>' :
          '<div class="nums"><div><label>A los días</label><input type="number" class="pDias" value="' + h(p.dias) + '"></div>' +
          '<div><label>Cada (días)</label><input type="number" class="pFrec" value="' + h(p.frecuencia) + '"></div>' +
          '<div><label>Veces</label><input type="number" class="pVeces" value="' + h(p.eventos || 1) + '" min="1"></div></div>') +
          '</div></div>';
      }).join('');
    }).join('') : '<p class="vacio">El departamento no tiene plantillas de muestreo. El propietario las agrega en Configuración.</p>';
  }

  function cablearBuscador(){
    var caja = $('nBusca'), lista = $('nSug'), espera;
    caja.oninput = function(){
      clearTimeout(espera);
      var q = caja.value.trim();
      if (q.length < 2) { lista.innerHTML = ''; return; }
      espera = setTimeout(function(){
        api('sugerirLotes', q).then(function(res){
          lista.innerHTML = res.length ? res.map(function(l){
            return '<button class="sug" data-lote="' + h(l.lote) + '"><b>' + h(l.lote) + '</b>' + h(l.finca) + ' · ' + h(l.desc) +
              '<em>Zona ' + h(l.zona) + ' · ' + h(l.variedad) + ' · ' + h(l.areaHa) + ' ha</em></button>';
          }).join('') : '<div class="sug">Sin coincidencias</div>';
          al('[data-lote]', 'mousedown', function(b, ev){ ev.preventDefault(); agregarLote(b.dataset.lote); }, lista);
        }).catch(function(){ lista.innerHTML = ''; });
      }, 250);
    };
    caja.onblur = function(){ setTimeout(function(){ lista.innerHTML = ''; }, 200); };
    caja.onkeydown = function(e){ if (e.key === 'Enter' && /^\d{7}$/.test(caja.value.trim())) agregarLote(caja.value.trim()); };
  }

  function agregarLote(codigo){
    $('nBusca').value = ''; $('nSug').innerHTML = '';
    if (NE.lotes.some(function(l){ return l.lote === codigo; })) return msg('Ese lote ya está en la lista.', 'info');
    api('fichasDeLotes', [codigo]).then(function(r){
      if (!r.length) return msg('No se encontró el lote ' + h(codigo) + ' en la capa.', 'err');
      var f = r[0]; f.rol = NE.lotes.length ? 'TESTIGO' : 'ENSAYO';
      NE.lotes.push(f); pintarLotes();
    }).catch(fallo);
  }

  function pintarLotes(){
    $('nLotes').innerHTML = NE.lotes.map(function(l, i){
      return '<div class="lote' + (l.rol === 'TESTIGO' ? ' testigo' : '') + '"><div class="cab"><b>' + h(l.lote) + '</b>' +
        '<select data-rol="' + i + '">' + opciones([{ v: 'ENSAYO', t: 'Ensayo' }, { v: 'TESTIGO', t: 'Testigo' }], l.rol) + '</select>' +
        '<button class="icono" data-quitar="' + i + '">×</button></div><div class="datos">' +
        dato('Finca', l.finca) + dato('Zona', l.zona) + dato('Sector', l.desc) + dato('Variedad', l.variedad) +
        dato('Área', l.areaHa + ' ha') + dato('Riego', l.riego) + '</div>' +
        (l.ensayosActivos.length ? '<div class="ocupado">Ya tiene ' + l.ensayosActivos.length + ' ensayo(s) activo(s): ' +
          l.ensayosActivos.map(function(o){ return h(o.nombre) + ' (' + h(o.deptoNombre) + ')'; }).join(', ') + '</div>' : '') +
        '</div>';
    }).join('');
    var ha = NE.lotes.filter(function(l){ return l.rol !== 'TESTIGO'; }).reduce(function(s, l){ return s + (Number(l.areaHa) || 0); }, 0);
    var vars = []; NE.lotes.forEach(function(l){ if (vars.indexOf(l.variedad) < 0) vars.push(l.variedad); });
    $('nResumen').innerHTML = NE.lotes.length ? '<b>' + NE.lotes.length + '</b> lote(s) · <b>' + numero(ha, 2) + '</b> ha en ensayo · ' +
      h(vars.join(', ')) + (vars.length > 1 ? ' — hay más de una variedad; considere si conviene analizarlos juntos.' : '') : '';
    al('[data-quitar]', 'click', function(b){ NE.lotes.splice(Number(b.dataset.quitar), 1); pintarLotes(); }, $('nLotes'));
    al('[data-rol]', 'change', function(s){ NE.lotes[Number(s.dataset.rol)].rol = s.value; pintarLotes(); }, $('nLotes'));
  }

  function crear(){
    if (!val('nNombre')) return msg('Escriba el nombre del ensayo.', 'err');
    if (!NE.lotes.length) return msg('Agregue al menos un lote.', 'err');
    var trats = $$('#nTrat tr').slice(1).map(function(tr){
      return { codigo: tr.querySelector('.tCod').value.trim(), descripcion: tr.querySelector('.tDesc').value.trim(),
               producto: tr.querySelector('.tProd').value.trim(), dosis: tr.querySelector('.tDosis').value.trim(),
               testigo: tr.querySelector('.tTest').checked };
    }).filter(function(t){ return t.codigo; });
    if (trats.length < 2) return msg('Registre al menos dos tratamientos.', 'err');
    var actividades = $$('[data-plantilla]:checked', cuerpo).map(function(c){
      var box = c.parentNode, g = function(cl){ var i = box.querySelector(cl); return i ? i.value : ''; };
      return { idPlantilla: c.dataset.plantilla, dias: g('.pDias'), frecuencia: g('.pFrec'), veces: g('.pVeces') };
    });
    var campos = {};
    $$('#nCampos [data-campo]').forEach(function(i){ if (i.value !== '') campos[i.dataset.campo] = i.value; });

    var b = $('nCrear'); b.disabled = true;
    msg('Creando el ensayo, las parcelas y el cronograma…', 'info', true);
    api('crearEnsayo', {
      departamento: depto, nombre: val('nNombre'), tipo: val('nTipo'), descripcion: val('nDesc'), objetivo: val('nObjetivo'),
      diseno: val('nDiseno'), repeticiones: val('nReps'), areaParcela: val('nArea'), surcosBorde: val('nSurcos'),
      fechaAplicacion: val('nFecha'), equipo: val('nEquipo'), llegaACosecha: val('nCosecha'),
      responsable: val('nResp'), email: val('nEmail'),
      lotes: NE.lotes.map(function(l){ return { lote: l.lote, rol: l.rol }; }),
      tratamientos: trats, actividades: actividades, campos: campos
    }).then(function(r){
      var id = r.id, pendientes = [];
      if ($('nProt').files[0]) pendientes.push(['PROTOCOLO', $('nProt')]);
      if ($('nCroq').files[0]) pendientes.push(['CROQUIS', $('nCroq')]);
      var shp = $('nShp').files[0] ? $('nShp') : null;
      var shpLeido = shp ? leerArchivo(shp, 20) : Promise.resolve(null);
      var cadena = Promise.resolve();
      pendientes.forEach(function(p){
        cadena = cadena.then(function(){ return leerArchivo(p[1]); }).then(function(f){
          msg('Subiendo ' + h(f.nombre) + '…', 'info', true);
          return api('subirArchivo', { idEnsayo: id, tipo: p[0], nombre: f.nombre, mime: f.mime, base64: f.base64 });
        });
      });
      return cadena.then(function(){ return shpLeido; }).then(function(archivoShp){
        msg('Ensayo creado: ' + r.parcelas + ' parcelas y ' + r.tareas + ' tareas programadas.' +
          (r.traslapes.length ? '<br>Atención: ' + r.traslapes.length + ' lote(s) ya tienen ensayos activos de otros departamentos.' : ''), 'ok', true);
        reemplazar(function(){ vistaEnsayo(id, archivoShp ? 'parcelas' : 'resumen', archivoShp); });
      });
    }).catch(function(e){ b.disabled = false; fallo(e); });
  }
}

function campoHTML(c){
  var etq = h(c.etiqueta) + (c.unidad ? ' (' + h(c.unidad) + ')' : '') + (c.obligatorio ? ' *' : '');
  var base = ' id="c_' + h(c.campo) + '" data-campo="' + h(c.campo) + '"';
  var ctl;
  if (c.tipo === 'lista') ctl = '<select' + base + '>' + opciones(c.opciones, '', '') + '</select>';
  else if (c.tipo === 'nota') ctl = '<textarea' + base + '></textarea>';
  else if (c.tipo === 'si_no') ctl = '<select' + base + '>' + opciones(['SI', 'NO'], '', '') + '</select>';
  else {
    var t = (c.tipo === 'numero' || c.tipo === 'entero') ? 'number' : c.tipo === 'fecha' ? 'date' : 'text';
    ctl = '<input type="' + t + '"' + (t === 'number' ? ' step="any"' : '') + base + '>';
  }
  return '<div><label>' + etq + '</label>' + ctl + (c.ayuda ? '<span class="ayuda">' + h(c.ayuda) + '</span>' : '') + '</div>';
}
</script>
<script>
/* ===================================================================
 * FICHA DEL ENSAYO
 * Resumen · Parcelas y mapa · Seguimiento · Bitácora · Archivos · Resultados
 * =================================================================== */
function vistaEnsayo(id, pestana, archivoParcelas){
  var F = null, actual = pestana || 'resumen';
  var cuerpo = armazon('Ensayo', id);

  function cargar(luego){
    return api('ensayo', id).then(function(r){
      F = r;
      armazon(r.ensayo.nombre, r.ensayo.deptoNombre + ' · ' + r.ensayo.id);
      cuerpo = $('cuerpo');
      cuerpo.innerHTML =
        '<div class="pestanas" id="pest">' + [['resumen', 'Resumen'], ['parcelas', 'Parcelas y mapa'], ['seguimiento', 'Seguimiento'],
          ['bitacora', 'Bitácora'], ['archivos', 'Archivos'], ['resultados', 'Resultados']].map(function(p){
          return '<button data-p="' + p[0] + '"' + (p[0] === actual ? ' class="on"' : '') + '>' + p[1] +
            (p[0] === 'bitacora' && r.bitacora.length ? ' · ' + r.bitacora.length : '') +
            (p[0] === 'archivos' && r.archivos.length ? ' · ' + r.archivos.length : '') + '</button>';
        }).join('') + '</div><div id="pCuerpo"></div>';
      al('#pest button', 'click', function(b){
        actual = b.dataset.p;
        $$('#pest button').forEach(function(x){ x.className = x === b ? 'on' : ''; });
        mostrar();
      });
      mostrar();
      if (luego) luego();
    }).catch(function(e){ cuerpo.innerHTML = '<div class="vacio">' + h(e.message) + '</div>'; });
  }

  function mostrar(){
    limpiarPantalla();
    var c = $('pCuerpo');
    ({ resumen: pResumen, parcelas: pParcelas, seguimiento: pSeguimiento, bitacora: pBitacora,
       archivos: pArchivos, resultados: pResultados })[actual](c);
  }

  /* ------------------------------ resumen ------------------------------ */
  function pResumen(c){
    var e = F.ensayo;
    c.innerHTML =
      (F.traslapes.length ? '<div class="aviso-barra"><b>Posible traslape:</b> ' + F.traslapes.map(function(t){
        return 'el lote ' + h(t.lote) + ' también tiene «' + h(t.ensayo) + '» de ' + h(t.departamento) + ' (aplicado ' + h(t.aplicacion || '—') + ')';
      }).join('; ') + '.</div>' : '') +
      '<div class="acciones" style="margin:0 0 14px">' + chipEstado(e.estado) +
        '<span class="tenue">' + (e.dda !== null ? e.dda + ' días después de la aplicación' : '') + '</span>' +
        (puede('editar') ? '<button class="sec chico" id="rEditar" style="margin-left:auto">Editar datos</button>' : '') + '</div>' +
      '<div class="ficha">' +
        dato('Departamento', e.deptoNombre) + dato('Tipo', e.tipo) + dato('Zona', e.zonas) + dato('Finca', e.fincas) +
        dato('Lotes', e.lotes) + dato('Variedad', e.variedad) + dato('Área en ensayo', e.areaHa ? e.areaHa + ' ha' : '') +
        dato('Diseño', String(e.diseno || '').replace(/_/g, ' ').toLowerCase()) +
        dato('Tratamientos × rep.', e.tratamientos + ' × ' + e.repeticiones) +
        dato('Área de parcela', e.areaParcela ? e.areaParcela + ' m²' : '') + dato('Surcos de borde', e.surcosBorde) +
        dato('Aplicación', e.aplicacion) + dato('Equipo', e.equipo) + dato('Cosecha estimada', e.cosechaEst) +
        dato('Responsable', e.responsable) + dato('Creado por', e.creadoPor + (e.creado ? ' · ' + e.creado : '')) +
      '</div>' +
      (e.descripcion ? '<h2>Descripción</h2><div class="texto-largo">' + h(e.descripcion) + '</div>' : '') +
      (e.objetivo ? '<h2>Objetivo</h2><div class="texto-largo">' + h(e.objetivo) + '</div>' : '') +
      (F.valores.length ? '<h2>Datos del departamento</h2><div class="ficha">' + F.valores.map(function(v){
        return dato(v.etiqueta, v.valor + (v.unidad ? ' ' + v.unidad : '')); }).join('') + '</div>' : '') +
      '<h2>Tratamientos</h2><div class="tabla-env" style="margin-bottom:18px"><table class="tabla"><tr><th>Código</th><th>Descripción</th><th>Producto</th><th>Dosis</th></tr>' +
        F.tratamientos.map(function(t){ return '<tr><td class="mono"><b>' + h(t.codigo) + '</b>' + (t.testigo ? ' <span class="chip">testigo</span>' : '') +
          '</td><td>' + h(t.descripcion) + '</td><td>' + h(t.producto) + '</td><td>' + h(t.dosis) + '</td></tr>'; }).join('') + '</table></div>' +
      '<h2>Lotes</h2><div class="lotes">' + F.lotes.map(function(l){
        return '<div class="lote' + (l.rol === 'TESTIGO' ? ' testigo' : '') + '"><div class="cab"><b>' + h(l.lote) + '</b><span class="chip">' + h(l.rol) + '</span></div>' +
          '<div class="datos">' + dato('Finca', l.finca) + dato('Zona', l.zona) + dato('Sector', l.desc) + dato('Variedad', l.variedad) +
          dato('Área', l.areaHa ? l.areaHa + ' ha' : '') + dato('Riego', l.riego) + '</div></div>';
      }).join('') + '</div>' +
      (e.carpeta ? '<p class="guia" style="margin-top:16px"><a href="' + h(e.carpeta) + '" target="_blank" rel="noopener">Carpeta del ensayo en Drive</a></p>' : '');
    if ($('rEditar')) $('rEditar').onclick = editar;
  }

  function editar(){
    var e = F.ensayo;
    var v = ventana('Editar datos del ensayo',
      '<label>Nombre</label><input id="eNombre" value="' + h(e.nombre) + '">' +
      '<label>Descripción</label><textarea id="eDesc" rows="3">' + h(e.descripcion) + '</textarea>' +
      '<label>Objetivo</label><textarea id="eObj" rows="2">' + h(e.objetivo) + '</textarea>' +
      '<div class="fila"><div><label>Estado</label><select id="eEstado">' + opciones(F.catalogos.estados, e.estado) + '</select></div>' +
      '<div><label>Surcos de borde</label><input id="eSurcos" type="number" min="0" value="' + h(e.surcosBorde) + '"></div></div>' +
      '<div class="fila"><div><label>Fecha de aplicación</label><input id="eFecha" type="date" value="' + h(e.aplicacionISO) + '"></div>' +
      '<div><label>Cosecha estimada</label><input id="eCos" type="date" value="' + h(e.cosechaISO) + '"></div></div>' +
      '<div class="fila"><div><label>Equipo</label><select id="eEquipo">' + opciones(F.catalogos.equipos, e.equipo, '—') + '</select></div>' +
      '<div><label>¿Llega a cosecha?</label><select id="eLlega">' + opciones(['SI', 'NO'], e.llegaACosecha || 'SI') + '</select></div></div>' +
      '<div class="fila"><div><label>Responsable</label><input id="eResp" value="' + h(e.responsable) + '"></div>' +
      '<div><label>Correo para avisos</label><input id="eEmail" value="' + h(e.email) + '"></div></div>' +
      '<p class="guia" style="margin-top:10px">Si cambia la fecha de aplicación, las tareas pendientes se mueven solas. ' +
      'Los cambios de fecha, estado y surcos quedan anotados en la bitácora.</p>' +
      '<div class="acciones"><button id="eGuardar">Guardar</button></div>');
    $('eGuardar').onclick = function(){
      var b = this; b.disabled = true;
      api('guardarEnsayo', id, { nombre: val('eNombre'), descripcion: val('eDesc'), objetivo: val('eObj'), estado: val('eEstado'),
        surcosBorde: val('eSurcos'), aplicacionISO: val('eFecha'), cosechaISO: val('eCos'), equipo: val('eEquipo'),
        llegaACosecha: val('eLlega'), responsable: val('eResp'), email: val('eEmail') })
        .then(function(r){ v.cerrar(); msg(h(r.mensaje), 'ok'); cargar(); })
        .catch(function(e){ b.disabled = false; fallo(e); });
    };
  }

  /* ------------------------- parcelas y mapa ------------------------- */
  function pParcelas(c){
    var p = F.parcelas;
    c.innerHTML =
      '<div class="cifras">' + cifra(p.n, 'parcelas') + cifra(p.conGeometria, 'con polígono', p.conGeometria < p.n ? 'aviso' : '') +
        cifra(p.bloques, 'bloques') + cifra(p.areaHa || '—', 'ha en parcelas') + '</div>' +
      (puede('editar') ? '<section class="seccion"><h2>Polígonos de las parcelas</h2>' +
        '<p class="guia">Suba el shapefile (.zip con .shp, .dbf y .prj), GeoJSON o KML. Cada polígono se enlaza con su parcela ' +
        'por el número; el área y el centroide se calculan del polígono.</p>' +
        '<div class="fila"><div><label>Archivo</label><input type="file" id="gArch" accept=".zip,.geojson,.json,.kml,.kmz"></div>' +
        '<div><label>Coordenadas</label><select id="gCrs">' + opciones([{ v: 'AUTO', t: 'Detectar (.prj)' }, { v: 'WGS84', t: 'Grados WGS84' },
          { v: 'UTM15N', t: 'UTM 15N' }, { v: 'UTM16N', t: 'UTM 16N' }, { v: 'GTM', t: 'GTM' }], 'AUTO') + '</select></div></div>' +
        '<div class="acciones"><button class="sec" id="gLeer">Leer archivo</button></div><div id="gMapeo"></div></section>' : '') +
      '<section class="seccion"><h2>Mapa</h2><div class="mapa-caja"><div class="mapa" id="mapaFicha"></div></div>' +
        '<div class="leyenda" id="leyFicha"></div></section>' +
      '<section class="seccion"><h2>Croquis de bloques</h2><div id="croquis" class="croquis"><div class="cargando">Cargando…</div></div></section>' +
      '<section class="seccion"><h2>Herramientas</h2><div class="rejilla">' +
        (puede('editar') ? accion('aleatorizar', IC.nuevo, 'Volver a aleatorizar', 'borra parcelas y polígonos') : '') +
        (puede('editar') ? accion('recalc', IC.revisar, 'Recalcular áreas', 'desde los polígonos') : '') +
        accion('exportar', IC.subir, 'Exportar GeoJSON', 'para QGIS o el dron') +
        (puede('editar') ? accion('protocolo', IC.doc, 'Protocolo en Docs', 'documento con croquis') : '') +
      '</div></section>';

    if ($('gLeer')) $('gLeer').onclick = function(){ leerArchivo($('gArch'), 20).then(mapeo).catch(fallo); };
    if (archivoParcelas) { var a = archivoParcelas; archivoParcelas = null; mapeo(a); }

    rutas(c, {
      aleatorizar: function(){ operacion('generarParcelas', [id], true); },
      recalc: function(){ operacion('recalcularGeometrias', [id]); },
      exportar: function(){ operacion('exportarGeoJSON', [id]); },
      protocolo: function(){ operacion('generarProtocolo', [id]); }
    });

    api('croquis', id).then(function(d){ $('croquis').innerHTML = croquisHTML(d.parcelas); }).catch(function(e){ $('croquis').innerHTML = h(e.message); });
    paqueteDe(id).then(function(pq){
      if (!$('mapaFicha')) return;
      MapaCampo.montar($('mapaFicha'), pq, { leyenda: $('leyFicha'), herramientas: true, alTocar: function(par){
        msg('Parcela <b>' + h(par.num) + '</b> · ' + h(par.trat) + ' · bloque ' + h(par.bloque) + (par.areaHa ? ' · ' + h(par.areaHa) + ' ha' : ''), 'info');
      } }).then(function(m){ if (m) alSalir(m.destruir); });
    }).catch(function(e){ $('mapaFicha').innerHTML = '<div class="vacio">' + h(e.message) + '</div>'; });
  }

  function mapeo(f){
    msg('Leyendo ' + h(f.nombre) + '…', 'info');
    var p = { idEnsayo: id, nombre: f.nombre, base64: f.base64 };
    api('inspeccionarParcelas', p).then(function(info){
      msg(info.n + ' polígonos en el archivo' + (info.prj ? ' · ' + h(info.prj.substring(0, 60)) : '') + '.', 'ok');
      var campos = info.campos;
      function sel(idSel, patron, vacio, extra){
        var pre = '';
        campos.forEach(function(cp){ if (!pre && patron.test(cp)) pre = cp; });
        return '<select id="' + idSel + '">' + (extra ? '<option value="__ORDEN__">Usar el orden del archivo</option>' : '') +
          opciones(campos, pre, vacio ? '— no usar —' : undefined) + '</select>';
      }
      $('gMapeo').innerHTML = '<div class="aviso-barra ok" style="margin-top:12px">Indique qué campo del archivo trae cada dato. ' +
        'Ejemplo del primer polígono: ' + h(JSON.stringify(info.muestra).substring(0, 160)) + '</div>' +
        '<div class="fila"><div><label>Número de parcela</label>' + sel('gPar', /parc|plot|num|^id$/i, false, true) + '</div>' +
        '<div><label>Tratamiento</label>' + sel('gTrat', /trat|treat|tto|trt/i, true) + '</div>' +
        '<div><label>Bloque</label>' + sel('gBloq', /bloq|block|rep/i, true) + '</div></div>' +
        '<label>Parcelas del archivo que no existen en el ensayo</label><select id="gModo">' +
          opciones([{ v: 'OMITIR', t: 'Omitirlas (solo actualizar las que ya existen)' }, { v: 'CREAR', t: 'Crearlas' }], F.parcelas.n ? 'OMITIR' : 'CREAR') + '</select>' +
        '<div class="acciones"><button id="gImportar">Cargar polígonos</button></div>';
      $('gImportar').onclick = function(){
        var b = this; b.disabled = true; msg('Cargando polígonos y calculando áreas…', 'info', true);
        api('importarParcelas', { idEnsayo: id, nombre: f.nombre, base64: f.base64, crs: $('gCrs') ? val('gCrs') : 'AUTO',
          campoParcela: val('gPar'), campoTrat: val('gTrat'), campoBloque: val('gBloq'), modo: val('gModo') })
          .then(function(r){ msg(h(r.mensaje), 'ok', true); Paquetes.olvidar(id); cargar(); })
          .catch(function(e){ b.disabled = false; fallo(e); });
      };
    }).catch(fallo);
  }

  function operacion(metodo, args, confirmar){
    msg('Trabajando…', 'info', true);
    api.apply(null, [metodo].concat(args)).then(function(r){
      if (r && r.confirmar) {
        msg('');
        if (!confirm(r.mensaje + '\n\n¿Continuar?')) return;
        return operacion(metodo, args.concat([true]));
      }
      msg(h((r && r.mensaje) || 'Listo.') + (r && r.url ? ' <a href="' + h(r.url) + '" target="_blank" rel="noopener">Abrir</a>' : ''), 'ok', !!(r && r.url));
      if (/generarParcelas|recalcular/.test(metodo)) { Paquetes.olvidar(id); cargar(); }
    }).catch(fallo);
  }

  /* --------------------------- seguimiento --------------------------- */
  function pSeguimiento(c){
    var hoy = F.tareas.filter(function(t){ return ['PENDIENTE', 'AVISADO'].indexOf(t.estado) >= 0; });
    c.innerHTML =
      '<section class="seccion"><h2>Plan de muestreos, vuelos y cosecha</h2>' +
      (F.plan.length ? F.plan.map(function(p){
        var sinDias = p.dias === '' || p.dias === null;
        return '<div class="actividad"><div class="txt"><b>' + h(p.actividad) + '</b><span class="tipo-act ' + h(p.tipo) + '">' + h(p.tipo) + '</span>' +
          '<span>' + (sinDias ? 'Fecha según el programa de corte' : 'A los ' + h(p.dias) + ' DDA' +
            (Number(p.eventos) > 1 ? ', cada ' + h(p.frecuencia) + ' días, ' + h(p.eventos) + ' veces' : '')) +
          (p.submuestras ? ' · ' + h(p.submuestras) + ' submuestras por parcela' : '') + '</span>' +
          '<span>' + h(p.variables || '') + '</span></div>' +
          (puede('editar') ? '<button class="icono" data-quitar-plan="' + h(p.id) + '" title="Quitar del plan">×</button>' : '') + '</div>';
      }).join('') : '<p class="vacio">Este ensayo no tiene actividades de seguimiento.</p>') +
      (puede('editar') ? '<div class="acciones"><button class="sec" id="sAgregar">Agregar actividad</button>' +
        '<button class="sec" id="sReprog">Reprogramar tareas</button><button class="sec" id="sIndices">Importar índices de vuelo</button></div>' : '') +
      '</section>' +
      '<section class="seccion"><h2>Tareas · ' + hoy.length + ' pendientes</h2>' +
      (F.tareas.length ? '<div class="tabla-env"><table class="tabla"><tr><th>Fecha</th><th>Actividad</th><th>Estado</th></tr>' +
        F.tareas.map(function(t){
          var cls = t.estado === 'REALIZADO' || t.estado === 'CANCELADO' ? 'hecho' : (t.faltan < 0 ? 'tarde' : t.faltan <= 7 ? 'pronto' : '');
          return '<tr class="' + cls + '"><td class="mono">' + h(t.fecha) + '<br><span class="tenue">' + cuando(t.faltan) + '</span></td>' +

            '<td>' + chipEstado(t.estado) + (['PENDIENTE', 'AVISADO'].indexOf(t.estado) >= 0 ? '<br><button class="sec chico" style="margin-top:6px" data-hecha="' + h(t.id) + '">Realizada</button>' : '') + '</td></tr>';
        }).join('') + '</table></div>' : '<p class="vacio">Sin tareas.</p>') + '</section>';

    al('[data-quitar-plan]', 'click', function(b){

  /* ----------------------------- resultados ----------------------------- */
  function pResultados(c){
    c.innerHTML = '<div class="cifras">' + cifra(F.datos.muestreo, 'datos de muestreo') + cifra(F.datos.cosecha, 'registros de cosecha') + '</div>' +

    api('variables', id).then(function(r){
